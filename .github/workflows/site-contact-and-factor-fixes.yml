name: Apply site contact and factor fixes

on:
  push:
    paths:
      - '.github/workflows/site-contact-and-factor-fixes.yml'

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch visible phone text, homepage hours, and factor lettering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          phone_patterns = [
              re.compile(r'\(239\)\s*400[-\s.]?3733', re.I),
              re.compile(r'239[-.\s]400[-.\s]3733', re.I),
          ]

          def replace_visible_text(html: str) -> str:
              protected = []
              def protect(m):
                  protected.append(m.group(0))
                  return f'@@PROTECTED_{len(protected)-1}@@'

              temp = re.sub(r'<(?:script|style)\b[^>]*>.*?</(?:script|style)>', protect, html,
                            flags=re.I | re.S)

              def repl_text(m):
                  text = m.group(1)
                  for pat in phone_patterns:
                      text = pat.sub('(239) 400-FREE', text)
                  return '>' + text + '<'

              temp = re.sub(r'>([^<>]*)<', repl_text, temp)
              for i, block in enumerate(protected):
                  temp = temp.replace(f'@@PROTECTED_{i}@@', block)
              return temp

          changed = []
          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              original = path.read_text(encoding='utf-8')
              updated = replace_visible_text(original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          # Homepage: retain Location, remove the hours label/content shown at the bottom.
          home = Path('index.html')
          if home.exists():
              original = home.read_text(encoding='utf-8')
              updated = original
              updated = re.sub(r'Location\s*(?:&amp;|&|and)\s*Hours', 'Location', updated, flags=re.I)
              updated = re.sub(r'<(?:p|li|div|span)\b[^>]*>\s*(?:Office\s+)?Hours\s*:.*?</(?:p|li|div|span)>', '', updated, flags=re.I | re.S)
              updated = re.sub(r'<(?:p|li|div|span)\b[^>]*>\s*(?:Monday|Mon\.?)[^<]*(?:Friday|Fri\.?)[^<]*</(?:p|li|div|span)>', '', updated, flags=re.I | re.S)
              if updated != original:
                  home.write_text(updated, encoding='utf-8')
                  changed.append('index.html')

          # Best-interests page: mirror the statute with lettered factors (a) through (t).
          page = Path('best-interests-of-the-child-florida/index.html')
          if page.exists():
              original = page.read_text(encoding='utf-8')
              updated = original
              letters = [chr(ord('a') + i) for i in range(20)]

              # Convert a dedicated ordered factor list into lettered paragraphs.
              match = re.search(r'<ol\b[^>]*class=["\'][^"\']*factors[^"\']*["\'][^>]*>(.*?)</ol>', updated, flags=re.I | re.S)
              if not match:
                  # Fallback: first ordered list containing at least 20 list items after the factors heading.
                  heading_pos = updated.lower().find('florida best interests')
                  search_area = updated[heading_pos:] if heading_pos >= 0 else updated
                  m2 = re.search(r'<ol\b[^>]*>(.*?)</ol>', search_area, flags=re.I | re.S)
                  if m2 and len(re.findall(r'<li\b', m2.group(1), flags=re.I)) >= 20:
                      start = (heading_pos if heading_pos >= 0 else 0) + m2.start()
                      end = (heading_pos if heading_pos >= 0 else 0) + m2.end()
                      match = re.match(r'.*', updated[start:end], flags=re.S)
                      factor_start, factor_end = start, end
                  else:
                      factor_start = factor_end = None
              else:
                  factor_start, factor_end = match.start(), match.end()

              if factor_start is not None:
                  block = updated[factor_start:factor_end]
                  items = re.findall(r'<li\b[^>]*>(.*?)</li>', block, flags=re.I | re.S)
                  if len(items) >= 20:
                      rendered = '<div class="factors">\n' + '\n'.join(
                          f'<p><strong>({letters[i]})</strong> {items[i].strip()}</p>' for i in range(20)
                      ) + '\n</div>'
                      updated = updated[:factor_start] + rendered + updated[factor_end:]

              # Fallback for manually numbered bold prefixes.
              for i, letter in enumerate(letters, 1):
                  updated = re.sub(rf'(<strong>\s*){i}[\.)](\s*</strong>)', rf'\1({letter})\2', updated)

              if updated != original:
                  page.write_text(updated, encoding='utf-8')
                  changed.append(str(page))

          print('Changed files:')
          for item in sorted(set(changed)):
              print(item)
          PY

      - name: Commit completed fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/site-contact-and-factor-fixes.yml
          git add -- '*.html' 'index.html' 'best-interests-of-the-child-florida/index.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Use 239-400-FREE and correct homepage and statutory factors"
          git push origin main
