name: Add best interests page links
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-best-interests-links.yml'
permissions:
  contents: write
jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add links to family law navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = '/best-interests-of-the-child-florida/'
          files = [Path('index.html'), Path('divorce/index.html'), Path('child-custody/index.html')]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if target in s:
                  continue
              link = '<li><a href="/best-interests-of-the-child-florida/">Best Interests of the Child</a></li>'
              inserted = False
              markers = [
                  '<li><a href="/child-custody/">',
                  '<li><a href="https://www.kenturnerlaw.com/child-custody/"',
                  '<span class="kt-sidebar-parent">Family Law</span>'
              ]
              for marker in markers:
                  pos = s.find(marker)
                  if pos != -1:
                      if marker.startswith('<span'):
                          ul = s.find('<ul', pos)
                          gt = s.find('>', ul)
                          if ul != -1 and gt != -1:
                              s = s[:gt+1] + '\n              ' + link + s[gt+1:]
                              inserted = True
                              break
                      else:
                          end = s.find('</li>', pos)
                          if end != -1:
                              end += len('</li>')
                              s = s[:end] + '\n      ' + link + s[end:]
                              inserted = True
                              break
              if inserted:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html divorce/index.html child-custody/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Link best interests page from family law navigation"
            git push
          fi