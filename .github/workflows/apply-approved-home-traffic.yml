name: Apply approved homepage and traffic updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-home-traffic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved updates
        shell: python
        run: |
          from pathlib import Path
          import re

          home = Path('index.html')
          text = home.read_text()

          text = text.replace(
              '<title>Criminal Defense Attorney | Free Consultation | Ken Turner Law</title>',
              '<title>Naples Criminal Defense Lawyer | Free Consultation | Ken Turner Law</title>'
          )
          text = text.replace(
              'content="Criminal Defense Attorney | Free Consultation | Ken Turner Law"',
              'content="Naples Criminal Defense Lawyer | Free Consultation | Ken Turner Law"'
          )
          old_desc = 'Arrested or under investigation? Contact criminal defense attorney Ken Turner for a free consultation. Serving Naples, Fort Myers, Miami, and Southwest Florida.'
          new_desc = 'Arrested or charged with a crime in Naples? Call criminal defense attorney Ken Turner for a free consultation. DUI, drug charges, domestic violence, felonies and misdemeanors.'
          text = text.replace(old_desc, new_desc)
          text = text.replace('>Book Free Consultation</a>', '>Schedule a Call</a>')

          traffic_item = '<li><a href="/traffic-tickets/">Traffic Tickets</a></li>'
          if traffic_item not in text:
              text = text.replace(
                  '<li><a href="/traffic-offenses/">Traffic Offenses</a></li>',
                  traffic_item + '\n          <li><a href="/traffic-offenses/">Traffic Offenses</a></li>'
              )
              text = text.replace(
                  '<a href="/traffic-offenses/">Traffic Offenses</a> |',
                  '<a href="/traffic-tickets/">Traffic Tickets</a> | <a href="/traffic-offenses/">Traffic Offenses</a> |'
              )

          # Remove the later homepage rule that flattened the brand back to gold.
          text = text.replace(
              '.kt-home-rebuild .kt-home-brand strong,.kt-home-rebuild .kt-home-brand small,.kt-home-rebuild .kt-home-hero h1,.kt-home-rebuild .kt-home-eyebrow,.kt-home-rebuild .kt-home-intro,.kt-home-rebuild .kt-home-practices,.kt-home-rebuild .kt-free-consultation,.kt-home-rebuild .kt-home-action-secondary,.kt-home-rebuild .kt-header-call,.kt-home-rebuild .kt-acc-hint,.kt-home-rebuild .ampstart-navbar-trigger,.kt-home-rebuild .kt-sidebar-parent,.kt-home-rebuild .kt-sidebar-sub a,.kt-home-rebuild main h2,.kt-home-rebuild main h3,.kt-home-rebuild details.kt-acc>summary,.kt-home-rebuild .ampstart-footer small{color:#c99537;-webkit-text-fill-color:#c99537;filter:none;text-shadow:0 -1px 0 #2a1603,0 1px 0 #f7dea0,1px 2px 0 #65400e,0 4px 4px #000}',
              '.kt-home-rebuild .kt-home-brand small,.kt-home-rebuild .kt-home-hero h1,.kt-home-rebuild .kt-home-eyebrow,.kt-home-rebuild .kt-home-intro,.kt-home-rebuild .kt-home-practices,.kt-home-rebuild .kt-free-consultation,.kt-home-rebuild .kt-home-action-secondary,.kt-home-rebuild .kt-header-call,.kt-home-rebuild .kt-acc-hint,.kt-home-rebuild .kt-sidebar-parent,.kt-home-rebuild .kt-sidebar-sub a,.kt-home-rebuild main h2,.kt-home-rebuild main h3,.kt-home-rebuild details.kt-acc>summary,.kt-home-rebuild .ampstart-footer small{color:#c99537;-webkit-text-fill-color:#c99537;filter:none;text-shadow:0 -1px 0 #2a1603,0 1px 0 #f7dea0,1px 2px 0 #65400e,0 4px 4px #000}'
          )
          text = text.replace(
              '.kt-home-rebuild .kt-home-brand strong,.kt-home-rebuild .kt-home-hero h1{background:none;-webkit-background-clip:border-box;background-clip:border-box}',
              '.kt-home-rebuild .kt-home-hero h1{background:none;-webkit-background-clip:border-box;background-clip:border-box}'
          )

          correction = '''
/* KT-APPROVED-HEADER-CORRECTION-2026-08-11 */
.kt-home-rebuild .kt-home-header{background-color:transparent;background-image:var(--kt-leather-v2);background-size:cover;background-repeat:no-repeat;background-position:center;border-bottom:1px solid rgba(255,255,255,.08);box-shadow:none}
.kt-home-rebuild .kt-home-brand strong{display:block;font-size:1rem;font-weight:700;color:#c9ccd1;background:linear-gradient(180deg,#f7f8f9 0%,#d8dade 24%,#8f949b 48%,#e7e9eb 67%,#a9adb3 82%,#737880 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:none;text-shadow:0 -1px 0 rgba(0,0,0,.92),0 1px 0 rgba(255,255,255,.58),0 2px 1px rgba(0,0,0,.42)}
.kt-home-rebuild .ampstart-navbar-trigger{color:#d8dade;-webkit-text-fill-color:#d8dade;text-shadow:0 -1px 0 rgba(0,0,0,.88),0 1px 0 rgba(255,255,255,.52)}
.kt-home-rebuild .kt-header-call{color:#fff;-webkit-text-fill-color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 28%,rgba(0,0,0,.26)),var(--kt-leather-v2);background-size:cover;background-position:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 4px rgba(0,0,0,.24),0 4px 10px rgba(0,0,0,.35);text-shadow:none}
.kt-home-rebuild .kt-home-hero{background-size:cover;background-repeat:no-repeat;background-position:center top}
'''
          if 'KT-APPROVED-HEADER-CORRECTION-2026-08-11' not in text:
              text = text.replace('</style>', correction + '</style>', 1)

          home.write_text(text)

          traffic_page = '''<!doctype html>
<html amp lang="en">
<head>
<meta charset="utf-8">
<script async src="https://cdn.ampproject.org/v0.js"></script>
<link rel="canonical" href="https://www.kenturnerlaw.com/traffic-tickets/">
<meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
<title>Traffic Ticket Attorney | Florida Traffic Tickets | Ken Turner Law</title>
<meta name="description" content="Got a Florida traffic ticket? Do not just pay it before you know your options. Ken Turner handles traffic ticket cases in Naples and Southwest Florida. Free consultation.">
<meta property="og:title" content="Traffic Ticket Attorney | Florida Traffic Tickets | Ken Turner Law">
<meta property="og:description" content="Got a Florida traffic ticket? Do not just pay it before you know your options. Free consultation with attorney Ken Turner.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.kenturnerlaw.com/traffic-tickets/">
<style amp-custom>
*{box-sizing:border-box}body{margin:0;color:#f7f3e8;font-family:Georgia,"Times New Roman",serif;line-height:1.65;background:#030303 url('/img/dark-pebbled-leather-v2.webp') center top/cover fixed no-repeat}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:transparent;border-bottom:1px solid rgba(255,255,255,.12);font-family:Arial,sans-serif}.brand{color:#d8dade;text-decoration:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.5)}.call{color:#fff;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.35)}main{max-width:860px;margin:auto;padding:44px 22px 70px}.eyebrow{font:700 13px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#d6d8da;margin:0 0 10px}h1{font-size:clamp(2.35rem,7vw,4.8rem);line-height:1.02;margin:0 0 18px;color:#d8dade;text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.42)}.lead{font-size:1.3rem;margin:0 0 16px}.free{display:inline-block;margin:8px 0 18px;font:700 1rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#e4c36a}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 36px}.btn{display:inline-block;padding:13px 18px;border:1px solid #a8822e;text-decoration:none;font:700 14px Arial,sans-serif;text-transform:uppercase}.primary{color:#151008;background:linear-gradient(180deg,#fff0a3,#d5aa43 50%,#936819);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 6px 14px rgba(0,0,0,.4)}.secondary{color:#fff;border-color:rgba(255,255,255,.24);border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.35)}h2{color:#e4c36a;font-size:1.75rem;line-height:1.2;margin:1.8em 0 .55em}p,li{font-size:1.1rem}.links{display:grid;gap:10px;margin:24px 0}.links a{color:#f0d77e}footer{margin-top:48px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);font:14px Arial,sans-serif;color:#ddd}@media(max-width:600px){main{padding:32px 16px 50px}.top{align-items:flex-start;flex-direction:column}.actions{flex-direction:column}.btn{text-align:center}}
</style>
<style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
</head>
<body>
<header class="top"><a class="brand" href="/">Ken Turner Law</a><a class="call" href="tel:+12394003733">Call Now</a></header>
<main>
<p class="eyebrow">Florida Traffic Tickets</p>
<h1>Traffic Ticket Attorney</h1>
<p class="lead"><strong>Got a traffic ticket? Do not just pay it before you know your options.</strong></p>
<p>Paying a ticket can mean points, traffic school, higher insurance costs, and giving up the opportunity to have the charge reduced or dismissed. Even if you believe the ticket was justified, paying it is probably not your best option until you know what can be done.</p>
<p class="free">Free Consultation</p>
<div class="actions"><a class="btn primary" href="https://kenturnerlaw.as.me/" target="_blank" rel="noopener">Schedule a Call</a><a class="btn secondary" href="tel:+12394003733">Call Now</a></div>
<h2>Traffic Tickets I Handle</h2>
<ul><li>Speeding tickets</li><li>Careless driving</li><li>Driving while license suspended</li><li>No valid driver license</li><li>Red light tickets</li><li>Traffic cases requiring a court appearance</li></ul>
<h2>Before You Pay the Ticket</h2>
<p>Paying the fine closes off options. Depending on the ticket and your driving record, an attorney may be able to seek dismissal, a reduction, withheld adjudication, fewer points, or another result that protects your license and limits the long-term cost of the citation.</p>
<h2>Traffic Ticket Information</h2>
<div class="links"><a href="/dont-pay-your-traffic-ticket-yet/">Do Not Pay Your Traffic Ticket Yet</a><a href="/what-do-i-do-when-i-get-a-traffic-ticket/">What Do I Do When I Get a Traffic Ticket?</a><a href="/why-do-i-need-an-attorney-for-a-traffic-ticket/">Why Do I Need an Attorney for a Traffic Ticket?</a><a href="/negative-consequences-of-paying-a-traffic-ticket/">Negative Consequences of Paying a Traffic Ticket</a><a href="/florida-traffic-ticket-answers/">Florida Traffic Ticket Answers</a><a href="/traffic-offenses/">Criminal Traffic Offenses</a><a href="/suspended-license/">Suspended License</a></div>
<footer>By Ken Turner, Attorney at Law · Ken Turner Law · Naples, Florida</footer>
</main>
</body>
</html>
'''
          tp = Path('traffic-tickets/index.html')
          tp.parent.mkdir(parents=True, exist_ok=True)
          tp.write_text(traffic_page)

          related = '<p><strong>Traffic Ticket Resources:</strong> <a href="/traffic-tickets/">Florida Traffic Tickets</a> | <a href="/florida-traffic-ticket-answers/">Traffic Ticket Answers</a></p>'
          for rel in [
              'dont-pay-your-traffic-ticket-yet/index.html',
              'what-do-i-do-when-i-get-a-traffic-ticket/index.html',
              'why-do-i-need-an-attorney-for-a-traffic-ticket/index.html',
              'negative-consequences-of-paying-a-traffic-ticket/index.html',
          ]:
              p = Path(rel)
              if not p.exists():
                  continue
              s = p.read_text()
              if '/traffic-tickets/' not in s:
                  if '</main>' in s:
                      s = s.replace('</main>', related + '</main>', 1)
                  elif '</body>' in s:
                      s = s.replace('</body>', related + '</body>', 1)
                  p.write_text(s)

          # Add the parent link to the traffic answer center.
          p = Path('florida-traffic-ticket-answers/index.html')
          if p.exists():
              s = p.read_text()
              if '/traffic-tickets/' not in s:
                  s = s.replace('<h1>Florida Traffic Ticket Answers</h1>', '<h1>Florida Traffic Ticket Answers</h1><p><a href="/traffic-tickets/">Florida Traffic Ticket Attorney &amp; Main Traffic Page</a></p>', 1)
                  p.write_text(s)

          # Add to sitemap.xml and sitemap.txt if not already present.
          xml = Path('sitemap.xml')
          if xml.exists():
              s = xml.read_text()
              url = 'https://www.kenturnerlaw.com/traffic-tickets/'
              if url not in s:
                  entry = f'  <url><loc>{url}</loc></url>\n'
                  s = s.replace('</urlset>', entry + '</urlset>')
                  xml.write_text(s)
          txt = Path('sitemap.txt')
          if txt.exists():
              s = txt.read_text()
              url = 'https://www.kenturnerlaw.com/traffic-tickets/'
              if url not in s:
                  if not s.endswith('\n'):
                      s += '\n'
                  s += url + '\n'
                  txt.write_text(s)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html traffic-tickets florida-traffic-ticket-answers sitemap.xml sitemap.txt dont-pay-your-traffic-ticket-yet what-do-i-do-when-i-get-a-traffic-ticket why-do-i-need-an-attorney-for-a-traffic-ticket negative-consequences-of-paying-a-traffic-ticket
          git rm .github/workflows/apply-approved-home-traffic.yml
          git commit -m "Apply approved homepage and traffic ticket updates"
          git push origin main
