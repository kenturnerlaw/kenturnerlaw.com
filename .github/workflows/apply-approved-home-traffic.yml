name: Apply approved site updates
on: [push]
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          home = Path('index.html')
          s = home.read_text()
          s = s.replace('<title>Criminal Defense Attorney | Free Consultation | Ken Turner Law</title>', '<title>Naples Criminal Defense Lawyer | Free Consultation | Ken Turner Law</title>')
          s = s.replace('content="Criminal Defense Attorney | Free Consultation | Ken Turner Law"', 'content="Naples Criminal Defense Lawyer | Free Consultation | Ken Turner Law"')
          old = 'Arrested or under investigation? Contact criminal defense attorney Ken Turner for a free consultation. Serving Naples, Fort Myers, Miami, and Southwest Florida.'
          new = 'Arrested or charged with a crime in Naples? Call criminal defense attorney Ken Turner for a free consultation. DUI, drug charges, domestic violence, felonies and misdemeanors.'
          s = s.replace(old, new)
          s = s.replace('Book Free Consultation', 'Schedule a Call')
          s = s.replace('DUI · Drug Charges · Traffic Offenses · Felonies', 'DUI · Drug Charges · Traffic Tickets · Traffic Offenses · Felonies')

          s = s.replace('.kt-home-rebuild .kt-home-header{height:4.25rem;padding:0 .8rem;display:grid;grid-template-columns:3rem 1fr auto;gap:.5rem;align-items:center;background-color:transparent;background-image:var(--kt-leather-v2);background-size:420px 420px}', '.kt-home-rebuild .kt-home-header{height:4.25rem;padding:0 .8rem;display:grid;grid-template-columns:3rem 1fr auto;gap:.5rem;align-items:center;background-color:transparent;background-image:var(--kt-leather-v2);background-size:cover;background-repeat:no-repeat;background-position:center;border-bottom:1px solid rgba(255,255,255,.08);box-shadow:none}')
          s = s.replace('.kt-home-rebuild .kt-home-header .ampstart-navbar-trigger{line-height:1;padding:.65rem .4rem;text-align:center;color:#d8dade;-webkit-text-fill-color:#d8dade;text-shadow:0 -1px 0 rgba(0,0,0,.88),0 1px 0 rgba(255,255,255,.55),0 2px 2px rgba(0,0,0,.48)}', '.kt-home-rebuild .kt-home-header .ampstart-navbar-trigger{line-height:1;padding:.65rem .4rem;text-align:center;color:#d8dade;-webkit-text-fill-color:#d8dade;text-shadow:0 -1px 0 rgba(0,0,0,.68),0 1px 0 rgba(255,255,255,.34)}')
          s = s.replace('.kt-home-rebuild .kt-home-brand strong{display:block;font-size:1rem;font-weight:700;color:#d7d9dc;background:linear-gradient(180deg,#f4f5f6 0%,#d9dbde 28%,#a9adb2 52%,#eceeef 72%,#b7bbc0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.2px rgba(76,80,86,.72);filter:none;text-shadow:none}', '.kt-home-rebuild .kt-home-brand strong{display:block;font-size:1rem;font-weight:700;color:#d7d9dc;background:linear-gradient(180deg,#f4f5f6 0%,#d9dbde 28%,#a9adb2 52%,#eceeef 72%,#b7bbc0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.2px rgba(76,80,86,.72);filter:none;text-shadow:0 -1px 0 rgba(0,0,0,.50),0 1px 0 rgba(255,255,255,.22)}')
          old_call = '.kt-home-rebuild .kt-header-call{padding:.55rem .65rem;border:1px solid #9b7326;color:#efd77e;font-family:Arial,sans-serif;font-size:.72rem;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,224,125,.12),0 4px 12px rgba(0,0,0,.5)}'
          new_call = '.kt-home-rebuild .kt-header-call{padding:.65rem .85rem;border:1px solid rgba(255,255,255,.24);border-radius:999px;color:#fff;-webkit-text-fill-color:#fff;font-family:Arial,sans-serif;font-size:.72rem;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap;background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 28%,rgba(0,0,0,.26)),var(--kt-leather-v2);background-size:cover;background-position:center;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 4px rgba(0,0,0,.24),0 4px 10px rgba(0,0,0,.35)}'
          s = s.replace(old_call, new_call)
          s = s.replace('background-size:auto,520px 520px}\n.kt-home-rebuild .kt-home-hero-media', 'background-size:cover;background-repeat:no-repeat;background-position:center top}\n.kt-home-rebuild .kt-home-hero-media', 1)

          parent_span = '<span class="kt-sidebar-parent">Traffic Tickets</span>'
          parent_link = '<a href="/traffic-tickets/" class="ampstart-nav-link kt-sidebar-parent">Traffic Tickets</a>'
          s = s.replace(parent_span, parent_link)
          if '<li><a href="/traffic-tickets/">Traffic Tickets</a></li>' not in s:
              marker = '<li><a href="/what-do-i-do-when-i-get-a-traffic-ticket/">What Do I Do When I Get a Traffic Ticket?</a></li>'
              s = s.replace(marker, '<li><a href="/traffic-tickets/">Traffic Tickets</a></li>\n  ' + marker, 1)
          s = s.replace('<a href="/traffic-offenses/">Traffic Offenses</a> | <a href="/suspended-license/">', '<a href="/traffic-offenses/">Traffic Offenses</a> | <a href="/traffic-tickets/">Traffic Tickets</a> | <a href="/suspended-license/">')
          home.write_text(s)

          # Make the Traffic Tickets heading a parent link sitewide where this static sidebar is duplicated.
          for p in Path('.').rglob('*.html'):
              if p == home:
                  continue
              t = p.read_text(errors='ignore')
              u = t.replace(parent_span, parent_link).replace('Book Free Consultation', 'Schedule a Call')
              if u != t:
                  p.write_text(u)

          traffic = Path('traffic-tickets/index.html')
          traffic.parent.mkdir(parents=True, exist_ok=True)
          traffic.write_text('''<!doctype html>
          <html amp lang="en"><head><meta charset="utf-8"><script async src="https://cdn.ampproject.org/v0.js"></script><link rel="canonical" href="https://www.kenturnerlaw.com/traffic-tickets/"><meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1"><title>Traffic Ticket Attorney | Florida Traffic Tickets | Ken Turner Law</title><meta name="description" content="Got a Florida traffic ticket? Do not just pay it before you know your options. Traffic ticket attorney Ken Turner offers a free consultation in Naples and Southwest Florida."><meta property="og:title" content="Traffic Ticket Attorney | Florida Traffic Tickets | Ken Turner Law"><meta property="og:description" content="Got a Florida traffic ticket? Do not just pay it before you know your options. Free consultation with attorney Ken Turner."><meta property="og:type" content="website"><meta property="og:url" content="https://www.kenturnerlaw.com/traffic-tickets/">
          <style amp-custom>*{box-sizing:border-box}body{margin:0;color:#f7f3e8;font-family:Arial,sans-serif;line-height:1.65;background:#030303 url('/img/dark-pebbled-leather-v2.webp') center top/cover fixed no-repeat}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand{color:#d8dade;text-decoration:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.24)}.call,.secondary{color:#fff;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:10px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.35)}main{max-width:860px;margin:auto;padding:44px 22px 70px}.eyebrow{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#d6d8da;margin:0 0 10px}h1{font-family:Georgia,serif;font-size:clamp(2.35rem,7vw,4.8rem);line-height:1.02;margin:0 0 18px;color:#d8dade;text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.28)}.lead{font-size:1.3rem}.free{display:inline-block;margin:8px 0 18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e4c36a}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 36px}.btn{display:inline-block;padding:13px 18px;text-decoration:none;font-weight:700;text-transform:uppercase}.primary{color:#151008;border:1px solid #a8822e;background:linear-gradient(180deg,#fff0a3,#d5aa43 50%,#936819);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 6px 14px rgba(0,0,0,.4)}h2{font-family:Georgia,serif;color:#e4c36a;font-size:1.75rem;line-height:1.2;margin:1.8em 0 .55em}p,li{font-size:1.1rem}.links{display:grid;gap:10px;margin:24px 0}.links a{color:#f0d77e}footer{margin-top:48px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);font-size:14px;color:#ddd}@media(max-width:600px){main{padding:32px 16px 50px}.actions{flex-direction:column}.btn{text-align:center}}</style>
          <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;animation:none}</style></noscript></head><body><header class="top"><a class="brand" href="/">Ken Turner Law</a><a class="call" href="tel:+12394003733">Call Now</a></header><main><p class="eyebrow">Florida Traffic Tickets</p><h1>Traffic Ticket Attorney</h1><p class="lead"><strong>Got a traffic ticket? Do not just pay it before you know your options.</strong></p><p>Paying a ticket can mean points, traffic school, higher insurance costs, and giving up the opportunity to have the charge reduced or dismissed. Even if you believe the ticket was justified, paying it is probably not your best option until you know what can be done.</p><p class="free">Free Consultation</p><div class="actions"><a class="btn primary" href="https://kenturnerlaw.as.me/" target="_blank" rel="noopener">Schedule a Call</a><a class="btn secondary" href="tel:+12394003733">Call Now</a></div><h2>Traffic Tickets I Handle</h2><ul><li>Speeding tickets</li><li>Careless driving</li><li>Driving while license suspended</li><li>No valid driver license</li><li>Red light tickets</li><li>Traffic cases requiring a court appearance</li></ul><h2>Before You Pay the Ticket</h2><p>Paying the fine closes off options. Depending on the ticket and your driving record, an attorney may be able to seek dismissal, a reduction, withheld adjudication, fewer points, or another result that protects your license and limits the long-term cost of the citation.</p><h2>Traffic Ticket Information</h2><div class="links"><a href="/dont-pay-your-traffic-ticket-yet/">Do Not Pay Your Traffic Ticket Yet</a><a href="/what-do-i-do-when-i-get-a-traffic-ticket/">What Do I Do When I Get a Traffic Ticket?</a><a href="/why-do-i-need-an-attorney-for-a-traffic-ticket/">Why Do I Need an Attorney for a Traffic Ticket?</a><a href="/negative-consequences-of-paying-a-traffic-ticket/">Negative Consequences of Paying a Traffic Ticket</a><a href="/florida-traffic-ticket-answers/">Florida Traffic Ticket Answers</a><a href="/traffic-offenses/">Criminal Traffic Offenses</a><a href="/suspended-license/">Suspended License</a></div><footer>By Ken Turner, Attorney at Law · Ken Turner Law · Naples, Florida</footer></main></body></html>''')

          related = '<p><strong>Traffic Ticket Resources:</strong> <a href="/traffic-tickets/">Florida Traffic Tickets</a> | <a href="/florida-traffic-ticket-answers/">Traffic Ticket Answers</a></p>'
          for rel in ['dont-pay-your-traffic-ticket-yet/index.html','what-do-i-do-when-i-get-a-traffic-ticket/index.html','why-do-i-need-an-attorney-for-a-traffic-ticket/index.html','negative-consequences-of-paying-a-traffic-ticket/index.html','traffic-offenses/index.html']:
              p = Path(rel)
              if p.exists():
                  t = p.read_text()
                  if '/traffic-tickets/' not in t:
                      if '</main>' in t: t = t.replace('</main>', related + '</main>', 1)
                      else: t = t.replace('</body>', related + '</body>', 1)
                      p.write_text(t)

          p = Path('florida-traffic-ticket-answers/index.html')
          if p.exists():
              t = p.read_text()
              if '/traffic-tickets/' not in t:
                  t = t.replace('<h1>Florida Traffic Ticket Answers</h1>', '<h1>Florida Traffic Ticket Answers</h1><p><a href="/traffic-tickets/">Florida Traffic Ticket Attorney &amp; Main Traffic Page</a></p>', 1)
                  p.write_text(t)

          url = 'https://www.kenturnerlaw.com/traffic-tickets/'
          p = Path('sitemap.xml')
          if p.exists():
              t = p.read_text()
              if url not in t: p.write_text(t.replace('</urlset>', f'  <url><loc>{url}</loc></url>\n</urlset>'))
          p = Path('sitemap.txt')
          if p.exists():
              t = p.read_text()
              if url not in t: p.write_text(t.rstrip() + '\n' + url + '\n')
          PY
      - name: Commit results
        run: |
          rm -f .github/workflows/apply-approved-home-traffic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply homepage, consultation, and traffic ticket updates"
          git push origin main
