name: Apply sitewide leather and metallic gold visual skin

on:
  push:
    branches: [main]
    paths:
      - '.github/apply-approved-legacy-style-trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply styling only to public AMP pages
        run: python3 .github/scripts/apply_approved_legacy_style.py
      - name: Install AMP validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate AMP integrity
        run: npm run validate:amp -- --amp-only
      - name: Commit visual-skin changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "No public AMP styling changes were necessary"
            exit 0
          fi
          git commit -m "Apply sitewide black leather and metallic gold visual skin"
          git push origin main
