name: Sync accordion pages from homepage template

on:
  push:
    branches: [main]
    paths:
      - '.github/apply-approved-legacy-style-trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Consolidate homepage CSS into one template
        run: node scripts/clean-home-template.mjs
      - name: Sync exact homepage header menu CSS and accordions
        run: node scripts/sync-home-template.mjs
      - name: Install AMP validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize AMP boilerplate and markup
        run: npm run repair:amp
      - name: Validate AMP integrity
        run: npm run validate:amp -- --amp-only
      - name: Commit validated homepage-template sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "No homepage-template sync changes were necessary"
            exit 0
          fi
          git commit -m "Consolidate homepage template and sync accordion pages"
          git push origin main
