name: Sync managed site theme from homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/apply-approved-legacy-style-trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync managed homepage theme header and menu
        run: node scripts/sync-home-template.mjs
      - name: Install AMP validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate AMP integrity
        run: npm run validate:amp -- --amp-only
      - name: Commit validated managed-theme sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "No managed-theme sync changes were necessary"
            exit 0
          fi
          git commit -m "Sync managed site theme from homepage"
          git push origin main
