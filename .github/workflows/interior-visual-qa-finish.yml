name: Interior visual QA finish

on:
  push:
    branches: [main]
    paths:
      - '.github/interior-visual-qa-trigger'

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete public test answers
        run: rm -rf florida-criminal-defense-answers/hello florida-criminal-defense-answers/hell

      - name: Rebuild Answer Center hubs and sitemap
        run: node tools/publish/build-v2.js

      - name: Update Answer Center navigation
        run: node tools/publish/update-answer-menus.js

      - name: Repair AMP markup
        run: npm run repair:amp

      - name: Apply current homepage managed theme
        run: node scripts/sync-home-template.mjs

      - name: Install AMP validator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate all AMP pages
        run: npm run validate:amp -- --amp-only

      - name: Verify test answers are gone
        shell: python
        run: |
          from pathlib import Path
          hub = Path('florida-criminal-defense-answers/index.html').read_text()
          sitemap = Path('sitemap.xml').read_text()
          assert '/florida-criminal-defense-answers/hello/' not in hub
          assert '/florida-criminal-defense-answers/hell/' not in hub
          assert '/florida-criminal-defense-answers/hello/' not in sitemap
          assert '/florida-criminal-defense-answers/hell/' not in sitemap
          assert '/florida-criminal-defense-answers/should-i-talk-to-police/' in hub

      - name: Commit validated Answer Center cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete public Answer Center test pages"
          git push origin main
