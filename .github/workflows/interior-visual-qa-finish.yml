name: Interior visual QA finish

on:
  push:
    branches: [main]
    paths:
      - '.github/interior-visual-qa-trigger'

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply interior QA source fixes
        run: python3 .github/scripts/interior_visual_qa.py

      - name: Check publisher syntax
        run: node --check tools/publish/build-v2.js

      - name: Rebuild Answer Center hubs
        run: node tools/publish/build-v2.js

      - name: Update Answer Center navigation
        run: node tools/publish/update-answer-menus.js

      - name: Repair AMP markup
        run: npm run repair:amp

      - name: Apply current homepage managed theme
        run: node scripts/sync-home-template.mjs

      - name: Install AMP validator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate all AMP pages
        run: npm run validate:amp -- --amp-only

      - name: Verify representative page types
        shell: python
        run: |
          from pathlib import Path
          home = Path('index.html').read_text()
          traffic = Path('traffic-tickets/index.html').read_text()
          hub = Path('florida-criminal-defense-answers/index.html').read_text()
          for f in ['criminal-defense/index.html','child-custody/index.html','criminal-defense-naples/index.html']:
              x = Path(f).read_text()
              assert 'body:not(.kt-home-rebuild) .ampstart-image-fullpage-hero>amp-img{display:none}' in x, f
          assert '<body class="kt-traffic-hub">' in traffic
          assert 'body.kt-traffic-hub .btn-primary' in traffic
          assert 'No articles published yet.' not in hub
          assert '/florida-criminal-defense-answers/should-i-talk-to-police/' in hub
          assert '/* Interior page compatibility */' in home

      - name: Commit validated interior QA fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html traffic-tickets/index.html tools/publish/build-v2.js sitemap.xml sitemap.txt search/published.json florida-criminal-defense-answers florida-family-law-answers florida-traffic-ticket-answers florida-legal-answers updates '*.html' ':(glob)**/*.html'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No interior QA changes were necessary"
            exit 0
          fi
          git commit -m "Align interior pages with homepage design and repair Answer Center hub"
          git push origin main
