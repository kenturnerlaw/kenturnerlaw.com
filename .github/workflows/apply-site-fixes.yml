name: Apply site navigation and design fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-site-fixes.yml'

permissions:
  contents: write

jobs:
  fix-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage navigation and answer page styling
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          home = root / 'index.html'
          text = home.read_text(encoding='utf-8')
          answer_url = 'https://www.kenturnerlaw.com/florida-criminal-defense-answers/'

          # Add the Answer Center to the sidebar immediately after the first Criminal Defense link.
          if answer_url not in text:
              sidebar_patterns = [
                  r'(<li[^>]*>\s*<a[^>]+href=["\']https://www\.kenturnerlaw\.com/criminal-defense/["\'][^>]*>\s*Criminal Defense\s*</a>\s*</li>)',
                  r'(<li[^>]*>\s*<a[^>]+href=["\']/criminal-defense/["\'][^>]*>\s*Criminal Defense\s*</a>\s*</li>)'
              ]
              sidebar_link = ('\n<li class="kt-sidebar-section"><a href="' + answer_url + '" '
                              'class="ampstart-nav-link kt-sidebar-parent" target="_self">'
                              'Florida Criminal Defense Answers</a></li>')
              for pattern in sidebar_patterns:
                  new_text, count = re.subn(pattern, r'\1' + sidebar_link, text, count=1, flags=re.I)
                  if count:
                      text = new_text
                      break

          # Add the Answer Center inside the visible Criminal Defense practice-area list.
          visible_marker = '<li><a href="/criminal-defense/">Criminal Defense</a>'
          visible_link = ('\n    <ul>\n      <li><a href="/florida-criminal-defense-answers/">'
                          'Florida Criminal Defense Answers</a></li>')
          if '/florida-criminal-defense-answers/">Florida Criminal Defense Answers' not in text:
              if visible_marker in text:
                  text = text.replace(visible_marker + '\n    <ul>', visible_marker + visible_link, 1)

          # Add a clear homepage resource link before the Family Law sidebar section as a fallback.
          if answer_url not in text:
              family_marker = '<li class="kt-sidebar-section">\n            <span class="kt-sidebar-parent">Family Law</span>'
              fallback = ('<li class="kt-sidebar-section"><a href="' + answer_url + '" '
                          'class="ampstart-nav-link kt-sidebar-parent" target="_self">'
                          'Florida Criminal Defense Answers</a></li>\n\n          ')
              text = text.replace(family_marker, fallback + family_marker, 1)

          home.write_text(text, encoding='utf-8')

          landing_css = """body{margin:0;background:#050505 url('/dark-leather.webp');color:#fff;font-family:'Playfair Display SC',Georgia,serif;line-height:1.75}a{color:#e4c36a;text-decoration:none}a:hover,a:focus{text-decoration:underline}header,main,footer{max-width:980px;margin:auto;padding:20px}.brand{font-size:1.2rem;letter-spacing:.1em;text-transform:uppercase}.hero{padding:48px 20px 28px;border-bottom:1px solid #7f6229}.hero h1{font-size:2.45rem;line-height:1.15;margin:.35rem 0;color:#fff;text-transform:uppercase;letter-spacing:.035em}.lede{font-size:1.12rem;max-width:800px;color:#eee}.card,.topic{background:rgba(8,8,8,.92);border:1px solid #8b6b2e;padding:22px;margin:20px 0;box-shadow:0 8px 24px rgba(0,0,0,.35)}.card h2,.topic h3,main>section>h2{margin-top:0;color:#efd98c;text-transform:uppercase;letter-spacing:.04em}.answer{padding:7px 0 19px;border-bottom:1px solid #292929}.answer:last-child{border-bottom:0}.answer strong{color:#efd98c}.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.topic{margin:0}.topic ul{padding-left:20px}.topic li{margin:.55rem 0}.cta{background:rgba(25,19,7,.95);text-align:center}.small{font-size:.9rem;color:#cfcfcf}nav{padding-top:10px}nav a{display:inline-block;margin:0 16px 8px 0}amp-accordion section{border:1px solid #6f5526;border-bottom:0}amp-accordion section:last-child{border-bottom:1px solid #6f5526}amp-accordion h3,amp-accordion section[expanded] h3{background:#111!important;color:#efd98c!important;padding:17px;margin:0;font-size:1.05rem;text-transform:none}amp-accordion div{padding:18px;background:#080808!important;color:#fff!important}footer{border-top:1px solid #6f5526;color:#ccc}@media(max-width:600px){.hero h1{font-size:2rem}.topic-grid{grid-template-columns:1fr}header,main,footer{padding:16px}}"""

          article_css = """body{margin:0;background:#050505 url('/dark-leather.webp');color:#fff;font-family:'Playfair Display SC',Georgia,serif;line-height:1.75}a{color:#e4c36a;text-decoration:none}a:hover,a:focus{text-decoration:underline}header,main,footer{max-width:900px;margin:auto;padding:20px}header{border-bottom:1px solid #7f6229;text-transform:uppercase;letter-spacing:.04em}main{padding-top:36px}h1{font-size:2.35rem;line-height:1.16;color:#fff;text-transform:uppercase;letter-spacing:.03em;margin:.35rem 0 1.35rem}h2{color:#efd98c;text-transform:uppercase;letter-spacing:.035em;margin-top:2rem}.card{background:rgba(8,8,8,.92);border:1px solid #8b6b2e;padding:22px;margin:22px 0;box-shadow:0 8px 24px rgba(0,0,0,.35)}.small{color:#cfcfcf;font-size:.9rem}.card h2:first-child{margin-top:0}footer{border-top:1px solid #6f5526;color:#ccc;margin-top:38px}@media(max-width:600px){h1{font-size:1.95rem}header,main,footer{padding:16px}}"""

          answer_root = root / 'florida-criminal-defense-answers'
          for page in answer_root.rglob('index.html'):
              html = page.read_text(encoding='utf-8')
              css = landing_css if page == answer_root / 'index.html' else article_css
              html, count = re.subn(r'<style amp-custom(?:="")?>.*?</style>', '<style amp-custom>' + css + '</style>', html, count=1, flags=re.S|re.I)
              if not count:
                  continue
              # Force an obvious route back to the homepage and Answer Center.
              if page != answer_root / 'index.html':
                  html = re.sub(
                      r'<header>.*?</header>',
                      '<header><a href="/">Ken Turner Law</a> &nbsp;|&nbsp; <a href="/florida-criminal-defense-answers/">Florida Criminal Defense Answers</a></header>',
                      html,
                      count=1,
                      flags=re.S|re.I,
                  )
              page.write_text(html, encoding='utf-8')

          # Remove this one-time workflow after it performs the repair.
          workflow = root / '.github/workflows/apply-site-fixes.yml'
          if workflow.exists():
              workflow.unlink()

      - name: Commit completed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html florida-criminal-defense-answers .github/workflows/apply-site-fixes.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Answer Center navigation, contrast, and site styling"
          git push
