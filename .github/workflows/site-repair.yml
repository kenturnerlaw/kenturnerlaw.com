name: Verify and repair site integration

on:
  push:
    paths:
      - '.github/run-site-repair'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair shared navigation and accessibility
        run: python3 .github/scripts/repair_navigation.py
      - name: Verify required source elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=[Path('index.html'),Path('best-interests-of-the-child-florida/index.html')]
          files+=sorted(Path('florida-criminal-defense-answers').rglob('index.html'))
          for p in files:
              s=p.read_text(encoding='utf-8')
              assert '<html amp' in s.lower() or '<html ⚡' in s.lower(), p
              assert '/best-interests-of-the-child-florida/' in s, p
              assert '/florida-criminal-defense-answers/' in s, p
              assert 'header-sidebar' in s, p
          readme=Path('README.md').read_text(encoding='utf-8')
          for phrase in ['Mobile first, always','Verification before completion','Shared components','GitHub and deployment']:
              assert phrase in readme, phrase
          print(f'Verified {len(files)} AMP pages and README rules')
          PY
      - name: Commit repaired website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md best-interests-of-the-child-florida florida-criminal-defense-answers
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes required'
          else
            git commit -m "Integrate full navigation across new AMP pages"
            git push origin main
          fi
