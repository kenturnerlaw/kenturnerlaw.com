name: Repair site menus

on:
  push:
    paths:
      - '.github/repair-site-menus-trigger'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply one AMP mobile-first menu to all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sidebar = '''<amp-sidebar class="px3 ampstart-sidebar" id="header-sidebar" layout="nodisplay" side="left">
  <div class="flex items-center justify-start ampstart-sidebar-header">
    <div class="ampstart-navbar-trigger items-start" on="tap:header-sidebar.toggle" role="button" tabindex="0" aria-label="Close menu">✕</div>
  </div>
  <nav class="ampstart-nav ampstart-sidebar-nav" aria-label="Site navigation">
    <ul class="m0 list-reset ampstart-label p0 kt-sidebar-menu">
      <li class="kt-sidebar-section"><a href="/" class="ampstart-nav-link kt-sidebar-parent">Home</a></li>
      <li class="kt-sidebar-section"><a href="/practice-areas/" class="ampstart-nav-link kt-sidebar-parent">Practice Areas</a></li>
      <li class="kt-sidebar-section">
        <a href="/criminal-defense/" class="ampstart-nav-link kt-sidebar-parent">Criminal Defense</a>
        <ul class="kt-sidebar-sub">
          <li><a href="/florida-criminal-defense-answers/">Florida Criminal Defense Answers</a></li>
          <li><a href="/arrested/">Arrested?</a></li>
          <li><a href="/dui/">DUI</a></li>
          <li><a href="/drug-charges/">Drug Charges</a></li>
          <li><a href="/domestic-violence/">Domestic Violence</a></li>
          <li><a href="/felony-charges/">Felony Charges</a></li>
          <li><a href="/misdemeanor-charges/">Misdemeanor Charges</a></li>
          <li><a href="/traffic-offenses/">Traffic Offenses</a></li>
          <li><a href="/suspended-license/">Suspended License</a></li>
          <li><a href="/violation-of-probation/">Violation of Probation</a></li>
        </ul>
      </li>
      <li class="kt-sidebar-section">
        <span class="kt-sidebar-parent">Family Law</span>
        <ul class="kt-sidebar-sub">
          <li><a href="/divorce/">Divorce</a></li>
          <li><a href="/child-custody/">Time-Sharing and Parenting Plans</a></li>
          <li><a href="/best-interests-of-the-child-florida/">Best Interests of the Child</a></li>
        </ul>
      </li>
      <li class="kt-sidebar-section"><a href="/reviews/" class="ampstart-nav-link kt-sidebar-parent">Reviews</a></li>
      <li class="kt-sidebar-section"><a href="/blog/" class="ampstart-nav-link kt-sidebar-parent">Blog</a></li>
      <li class="kt-sidebar-section kt-sidebar-action"><a href="tel:+12394003733" class="ampstart-nav-link kt-sidebar-parent">Call (239) 400-FREE</a></li>
      <li class="kt-sidebar-section"><a href="/ken-turner.vcf" class="ampstart-nav-link kt-sidebar-parent">Save Contact</a></li>
    </ul>
  </nav>
</amp-sidebar>'''

          topbar = '''<header class="kt-mobile-header">
  <button class="kt-menu-button" on="tap:header-sidebar.toggle" aria-label="Open menu">☰</button>
  <a class="kt-mobile-brand" href="/">
    <amp-img src="/favicon-32x32.png?v=6" width="32" height="32" alt="Ken Turner Law logo"></amp-img>
    <span>Ken Turner Law</span>
  </a>
  <a class="kt-mobile-call" href="tel:+12394003733" aria-label="Call Ken Turner Law">Call</a>
</header>'''

          css = '''
.kt-mobile-header{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-height:58px;padding:.45rem .75rem;border-bottom:1px solid #6f5526;background:#070707;position:relative;z-index:10}
.kt-mobile-brand{display:flex;align-items:center;gap:.5rem;color:#efd98c;text-decoration:none;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.kt-menu-button,.kt-mobile-call{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:1px solid #8b6b2e;border-radius:4px;background:#111;color:#efd98c;text-decoration:none;font:inherit}
.kt-sidebar-menu{padding-bottom:1rem}.ampstart-sidebar .kt-sidebar-section{margin:0 0 1rem}.kt-sidebar-parent{display:block;color:#fff;text-decoration:none;font-weight:700}.kt-sidebar-sub{list-style:none;margin:.5rem 0 0 .6rem;padding:0 0 0 .75rem;border-left:1px solid rgba(255,255,255,.28)}.kt-sidebar-sub li{margin:0 0 .5rem}.kt-sidebar-sub a{color:#fff;text-decoration:none;font-size:.95rem;line-height:1.3;opacity:.92}.kt-sidebar-action{margin-top:1.35rem}
'''

          targets = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          changed = []
          for p in targets:
              s = p.read_text(encoding='utf-8')
              original = s

              if '<html amp' not in s.lower() and '<html ⚡' not in s.lower():
                  continue

              if 'custom-element="amp-sidebar"' not in s and "custom-element=amp-sidebar" not in s:
                  runtime = re.search(r'<script[^>]+src=["\']?https://cdn\.ampproject\.org/v0\.js["\']?[^>]*></script>', s, re.I)
                  if runtime:
                      insert = runtime.group(0) + '\n<script async custom-element="amp-sidebar" src="https://cdn.ampproject.org/v0/amp-sidebar-0.1.js"></script>'
                      s = s[:runtime.start()] + insert + s[runtime.end():]

              if '<style amp-custom' in s and '.kt-mobile-header{' not in s:
                  s = re.sub(r'(<style amp-custom(?:="")?>)', r'\1' + css, s, count=1, flags=re.I)

              existing_sidebar = re.search(r'<amp-sidebar\b[^>]*\bid=["\']?header-sidebar["\']?[^>]*>.*?</amp-sidebar>', s, re.I|re.S)
              if existing_sidebar:
                  s = s[:existing_sidebar.start()] + sidebar + s[existing_sidebar.end():]

              is_new = p.as_posix().startswith('best-interests-of-the-child-florida/') or p.as_posix().startswith('florida-criminal-defense-answers/')
              if is_new:
                  # Remove prototype headers and bare link menus from the new pages.
                  s = re.sub(r'<header\b[^>]*>.*?</header>', '', s, count=1, flags=re.I|re.S)
                  s = re.sub(r'<nav class="kt-resource-links".*?</nav>', '', s, flags=re.I|re.S)
                  s = re.sub(r'<nav class="site-menu".*?</nav>', '', s, flags=re.I|re.S)
                  if 'class="kt-mobile-header"' not in s:
                      s = s.replace('<body>', '<body>\n' + topbar + '\n' + sidebar, 1)
                  elif 'id="header-sidebar"' not in s:
                      s = s.replace('</header>', '</header>\n' + sidebar, 1)

              # Existing pages keep their current top bar, but all sidebars now contain both resources.
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(p.as_posix())

          if not changed:
              raise SystemExit('No HTML files changed; menu repair not applied.')
          print('\n'.join(changed))
          PY

      - name: Commit verified menu source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-site-menus.yml .github/repair-site-menus-trigger
          git add -- '*.html'
          git diff --cached --check
          git commit -m "Apply consistent AMP navigation across site"
          git push origin main
