name: Apply header stamp styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-header-stamp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply silver stamped header treatment
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = {
            ".kt-home-rebuild .kt-home-header{height:4.25rem;padding:0 .8rem;display:grid;grid-template-columns:3rem 1fr auto;gap:.5rem;align-items:center;background-color:#030303;background-image:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.34)),var(--kt-leather-v2);background-size:auto,420px 420px}":
            ".kt-home-rebuild .kt-home-header{height:4.25rem;padding:0 .8rem;display:grid;grid-template-columns:3rem 1fr auto;gap:.5rem;align-items:center;background-color:transparent;background-image:var(--kt-leather-v2);background-size:420px 420px}",

            ".kt-home-rebuild .kt-home-header .ampstart-navbar-trigger{line-height:1;padding:.65rem .4rem;text-align:center}":
            ".kt-home-rebuild .kt-home-header .ampstart-navbar-trigger{line-height:1;padding:.65rem .4rem;text-align:center;color:#d8dade;-webkit-text-fill-color:#d8dade;text-shadow:0 -1px 0 rgba(0,0,0,.88),0 1px 0 rgba(255,255,255,.55),0 2px 2px rgba(0,0,0,.48)}",

            ".kt-home-rebuild .kt-home-brand strong{display:block;font-size:1rem;font-weight:700;background:linear-gradient(180deg,#fff7c9 0,#e8ca72 23%,#9a6a20 52%,#f0d98b 72%,#765019 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 #fff0b0) drop-shadow(0 2px 1px #000) drop-shadow(0 3px 2px #000)}":
            ".kt-home-rebuild .kt-home-brand strong{display:block;font-size:1rem;font-weight:700;color:#c9ccd1;background:linear-gradient(180deg,#f7f8f9 0%,#d8dade 24%,#8f949b 48%,#e7e9eb 67%,#a9adb3 82%,#737880 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:none;text-shadow:0 -1px 0 rgba(0,0,0,.92),0 1px 0 rgba(255,255,255,.58),0 2px 1px rgba(0,0,0,.58)}",

            ".kt-home-rebuild .kt-home-brand strong,.kt-home-rebuild .kt-home-brand small,.kt-home-rebuild .kt-home-hero h1,.kt-home-rebuild .kt-home-eyebrow,.kt-home-rebuild .kt-home-intro,.kt-home-rebuild .kt-home-practices,.kt-home-rebuild .kt-free-consultation,.kt-home-rebuild .kt-home-action-secondary,.kt-home-rebuild .kt-header-call,.kt-home-rebuild .kt-acc-hint,.kt-home-rebuild .ampstart-navbar-trigger,.kt-home-rebuild .kt-sidebar-parent,.kt-home-rebuild .kt-sidebar-sub a,.kt-home-rebuild main h2,.kt-home-rebuild main h3,.kt-home-rebuild details.kt-acc>summary,.kt-home-rebuild .ampstart-footer small{color:#c99537;-webkit-text-fill-color:#c99537;filter:none;text-shadow:0 -1px 0 #2a1603,0 1px 0 #f7dea0,1px 2px 0 #65400e,0 4px 4px #000}":
            ".kt-home-rebuild .kt-home-brand small,.kt-home-rebuild .kt-home-hero h1,.kt-home-rebuild .kt-home-eyebrow,.kt-home-rebuild .kt-home-intro,.kt-home-rebuild .kt-home-practices,.kt-home-rebuild .kt-free-consultation,.kt-home-rebuild .kt-home-action-secondary,.kt-home-rebuild .kt-header-call,.kt-home-rebuild .kt-acc-hint,.kt-home-rebuild .kt-sidebar-parent,.kt-home-rebuild .kt-sidebar-sub a,.kt-home-rebuild main h2,.kt-home-rebuild main h3,.kt-home-rebuild details.kt-acc>summary,.kt-home-rebuild .ampstart-footer small{color:#c99537;-webkit-text-fill-color:#c99537;filter:none;text-shadow:0 -1px 0 #2a1603,0 1px 0 #f7dea0,1px 2px 0 #65400e,0 4px 4px #000}",

            ".kt-home-rebuild .kt-home-brand strong,.kt-home-rebuild .kt-home-hero h1{background:none;-webkit-background-clip:border-box;background-clip:border-box}":
            ".kt-home-rebuild .kt-home-hero h1{background:none;-webkit-background-clip:border-box;background-clip:border-box}"
          }

          changed = False
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected CSS rule not found: {old[:90]}')
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text)

      - name: Commit homepage header fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style header brand as silver stamped leather"
          git push origin main
