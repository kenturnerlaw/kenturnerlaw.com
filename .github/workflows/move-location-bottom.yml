name: Move location bottom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-location-bottom.yml'

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move location section
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start = s.find('<section class="kt-location-section">')
          if start == -1:
              raise SystemExit('location section not found')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('location end not found')
          end += len('</section>')
          section = s[start:end]
          s = s[:start] + s[end:]
          marker = '    <!-- KT-RESOURCE-LINKS-2026-08-03 -->'
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('resource marker not found')
          s = s[:pos] + section + '\n\n' + s[pos:]
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move location address and client resources to bottom"
          git push
