name: Trigger mobile finalization

on:
  push:
    paths:
      - '.github/mobile-finalize-trigger'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Touch existing finalization workflow
        run: |
          printf '\n' >> .github/workflows/mobile-first-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mobile-first-finalize.yml
          git commit -m "Trigger mobile-first finalization"
          git push origin main
