name: Finalize mobile-first answer pages

on:
  push:
    paths:
      - '.github/workflows/mobile-first-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compact mobile header, share tools, footer mark, and README rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('best-interests-of-the-child-florida/index.html')]
          answer_root = Path('florida-criminal-defense-answers')
          if answer_root.exists():
              targets.extend(sorted(answer_root.rglob('index.html')))

          scripts = (
              '<script async custom-element="amp-sidebar" src="https://cdn.ampproject.org/v0/amp-sidebar-0.1.js"></script>\n'
              '<script async custom-element="amp-social-share" src="https://cdn.ampproject.org/v0/amp-social-share-0.1.js"></script>\n'
          )

          css = '''
.mobile-header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 14px;border-bottom:1px solid #6f5526;background:#070707}
.mobile-brand{display:flex;align-items:center;gap:9px;color:#efd98c;text-decoration:none;font-size:.96rem;letter-spacing:.05em;text-transform:uppercase}
.mobile-brand amp-img{border-radius:4px}
.menu-button{border:1px solid #8b6b2e;background:#111;color:#efd98c;border-radius:4px;padding:9px 11px;font-size:1.15rem;line-height:1;min-width:44px;min-height:44px}
.mobile-sidebar{background:#080808;color:#fff;width:min(86vw,330px);padding:18px}
.mobile-sidebar .close-menu{display:block;margin-left:auto;border:1px solid #8b6b2e;background:#111;color:#efd98c;padding:8px 11px;font-size:1rem}
.mobile-sidebar nav{display:block;padding-top:16px}
.mobile-sidebar nav a{display:block;margin:0;padding:13px 4px;border-bottom:1px solid #292929;color:#efd98c;text-decoration:none;font-size:1rem}
.page-tools{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 4px}
.page-tools a,.page-tools .tool-box{display:inline-flex;align-items:center;min-height:44px;border:1px solid #8b6b2e;border-radius:4px;padding:8px 11px;background:#111;color:#efd98c;text-decoration:none;font-size:.9rem}
.page-tools amp-social-share{border-radius:4px;min-width:44px;min-height:44px}
.ai-summary{border-left:3px solid #8b6b2e;padding:10px 13px;margin:12px 0 0;background:rgba(8,8,8,.72);font-size:.98rem}
.destrier-mark{text-align:center;margin-top:12px;font-size:.72rem;letter-spacing:.22em;color:#8d8d8d;text-transform:lowercase}
@media(max-width:600px){header,main,footer{padding-left:13px;padding-right:13px}.hero{padding:24px 4px 18px}.hero h1{font-size:1.72rem;line-height:1.12}.lede{font-size:1rem;line-height:1.55}.card{padding:16px;margin:16px 0}.site-menu,header>nav:not(.mobile-nav){display:none}.mobile-header{margin-left:-13px;margin-right:-13px}.page-tools{gap:7px}.page-tools a,.page-tools .tool-box{font-size:.84rem;padding:8px 9px}}
@media(min-width:601px){.mobile-header{max-width:980px;margin:auto}.mobile-sidebar{display:none}}
'''

          header = '''<div class="mobile-header">
<a class="mobile-brand" href="/"><amp-img src="/favicon-32x32.png?v=6" width="32" height="32" alt="Ken Turner Law horse and shield logo"></amp-img><span>Ken Turner Law</span></a>
<button class="menu-button" on="tap:site-menu-sidebar.open" aria-label="Open menu">☰</button>
</div>
<amp-sidebar id="site-menu-sidebar" class="mobile-sidebar" layout="nodisplay" side="right">
<button class="close-menu" on="tap:site-menu-sidebar.close" aria-label="Close menu">Close</button>
<nav aria-label="Mobile navigation">
<a href="/">Home</a>
<a href="/criminal-defense/">Criminal Defense</a>
<a href="/florida-criminal-defense-answers/">Criminal Defense Answers</a>
<a href="/divorce/">Divorce</a>
<a href="/child-custody/">Time-Sharing</a>
<a href="/best-interests-of-the-child-florida/">Best Interests of the Child</a>
<a href="/reviews/">Reviews</a>
<a href="tel:+12394003733">Call (239) 400-FREE</a>
<a href="/ken-turner.vcf" download>Save Contact</a>
</nav>
</amp-sidebar>'''

          for path in targets:
              if not path.exists():
                  continue
              html = path.read_text(encoding='utf-8')

              if 'custom-element="amp-sidebar"' not in html:
                  html = html.replace('<script async src="https://cdn.ampproject.org/v0.js"></script>', '<script async src="https://cdn.ampproject.org/v0.js"></script>\n' + scripts, 1)
              elif 'custom-element="amp-social-share"' not in html:
                  html = html.replace('</head>', scripts.splitlines()[1] + '\n</head>', 1)

              if '.mobile-header{' not in html:
                  html = html.replace('</style>\n</head>', css + '\n</style>\n</head>', 1)

              # Remove prior bulky header and replace with compact branded header.
              html = re.sub(r'<header\b[^>]*>.*?</header>', header, html, count=1, flags=re.I|re.S)
              if header not in html:
                  html = html.replace('<body>', '<body>\n' + header, 1)

              # Put an immediate summary above the fold when a lead paragraph exists.
              if 'class="ai-summary"' not in html:
                  m = re.search(r'(<section class="hero".*?</section>)', html, flags=re.I|re.S)
                  if m:
                      hero = m.group(1)
                      lead = re.search(r'<p class="lede">(.*?)</p>', hero, flags=re.I|re.S)
                      if lead:
                          summary = re.sub(r'<[^>]+>', '', lead.group(1)).strip()
                          hero = hero.replace('</section>', f'<p class="ai-summary"><strong>In brief:</strong> {summary}</p></section>', 1)
                          html = html[:m.start()] + hero + html[m.end():]

              if path == Path('best-interests-of-the-child-florida/index.html') and 'class="page-tools"' not in html:
                  tools = '''<div class="page-tools" aria-label="Page actions">
<div class="tool-box"><amp-social-share type="system" aria-label="Share this page"></amp-social-share></div>
<a href="/best-interests-of-the-child-florida/factors.txt" download>Copy / Download Factors</a>
<a href="/ken-turner.vcf" download>Save Ken Turner Contact</a>
</div>'''
                  html = html.replace('</section>', tools + '\n</section>', 1)

              if '~ destrier ~' not in html.lower():
                  html = html.replace('</footer>', '<div class="destrier-mark">~ destrier ~</div></footer>', 1)

              path.write_text(html, encoding='utf-8')

          readme = Path('README.md')
          rules = '''\n\n## Permanent mobile-first and client-use rules\n- Design and verify every page at phone width before desktop approval.\n- New content pages must use a compact branded header with the horse/shield mark and an AMP hamburger sidebar; never use a tall stack of bare navigation links.\n- Keep the page-specific introduction visible above the fold on mobile.\n- Include native device sharing where useful, downloadable contact information, and copy/download access for reusable legal text.\n- Place `~ destrier ~` unobtrusively at the bottom of every newly created content page.\n- AI discoverability must be implemented, not merely discussed: direct summaries, descriptive headings, canonical URLs, structured data, natural-language answers, primary-source references, and internal links.\n- Client resources must minimize cognitive load. Prefer one useful screen or one short page over comprehensive packets unless the user expressly requests depth.\n'''
          existing = readme.read_text(encoding='utf-8') if readme.exists() else '# kenturnerlaw.com\n'
          if 'Permanent mobile-first and client-use rules' not in existing:
              readme.write_text(existing.rstrip() + rules, encoding='utf-8')

          # AI-readable site guide.
          llms = Path('llms.txt')
          llms.write_text('''# Ken Turner Law\n\nKen Turner Law provides Florida criminal-defense and family-law information in plain English.\n\n## Primary resources\n- https://www.kenturnerlaw.com/florida-criminal-defense-answers/\n- https://www.kenturnerlaw.com/best-interests-of-the-child-florida/\n- https://www.kenturnerlaw.com/criminal-defense/\n- https://www.kenturnerlaw.com/divorce/\n- https://www.kenturnerlaw.com/child-custody/\n\n## Contact\nKen Turner, Florida attorney\nPhone: +1-239-400-3733\nEmail: ken@kenturnerlaw.com\nWebsite: https://www.kenturnerlaw.com/\n\nUse the canonical page URLs and verify current Florida statutes and rules before relying on legal information.\n''', encoding='utf-8')
          PY

      - name: Commit final mobile-first changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-first-finalize.yml
          git add README.md llms.txt best-interests-of-the-child-florida florida-criminal-defense-answers
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Finalize mobile-first pages, sharing, branding, and AI discovery"
          git push origin main
