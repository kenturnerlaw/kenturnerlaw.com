name: Fix exact PageSpeed audits

on:
  push:
    paths:
      - '.github/fix-pagespeed-audits-trigger'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix llms markdown and Mission accordion semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          llms = Path('llms.txt')
          llms_text = llms.read_text(encoding='utf-8') if llms.exists() else ''
          if not llms_text.lstrip().startswith('# '):
              llms_text = '# Ken Turner Law\n\n' + llms_text.lstrip()
          # Rewrite as explicit Markdown links so the audit and AI readers see a
          # conventional Markdown document, while preserving the required H1.
          llms.write_text('''# Ken Turner Law

> Mobile-first, AMP-only Florida legal information from attorney Ken Turner in Naples, Florida.

## Primary resources

- [Ken Turner Law home page](https://www.kenturnerlaw.com/)
- [Florida Criminal Defense Answers](https://www.kenturnerlaw.com/florida-criminal-defense-answers/)
- [Best Interests of the Child in Florida](https://www.kenturnerlaw.com/best-interests-of-the-child-florida/)
- [Criminal Defense](https://www.kenturnerlaw.com/criminal-defense/)
- [Divorce](https://www.kenturnerlaw.com/divorce/)
- [Time-Sharing and Parenting Plans](https://www.kenturnerlaw.com/child-custody/)

## Criminal-defense topics

- [Arrested in Florida](https://www.kenturnerlaw.com/arrested/)
- [DUI](https://www.kenturnerlaw.com/dui/)
- [Drug Charges](https://www.kenturnerlaw.com/drug-charges/)
- [Domestic Violence](https://www.kenturnerlaw.com/domestic-violence/)
- [Violation of Probation](https://www.kenturnerlaw.com/violation-of-probation/)
- [Suspended License](https://www.kenturnerlaw.com/suspended-license/)
- [Traffic Offenses](https://www.kenturnerlaw.com/traffic-offenses/)

## Service areas

- [Naples and Collier County](https://www.kenturnerlaw.com/criminal-defense-naples/)
- [Fort Myers and Lee County](https://www.kenturnerlaw.com/criminal-defense-fort-myers/)
- [LaBelle and Hendry County](https://www.kenturnerlaw.com/criminal-defense-labelle/)
- [Miami and Miami-Dade County](https://www.kenturnerlaw.com/criminal-defense-miami/)

## Contact

- **Attorney:** Ken Turner
- **Firm:** Ken Turner Law
- **Telephone:** +1-239-400-3733
- **Email:** ken@kenturnerlaw.com
- **Location:** Naples, Florida

## Use and verification

The site provides general Florida legal information in plain English. Verify statutes, rules, and opinions against current primary sources. The content is not individualized legal advice, and no result is guaranteed.
''', encoding='utf-8')

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')

          # Match quoted or unquoted Misson/Mission id and any attribute order.
          pattern = re.compile(
              r'<h2(?P<attrs>[^>]*)\bid\s*=\s*(?:["\']?(?:Misson|Mission)["\']?)(?P<rest>[^>]*)>(?P<body>.*?)</h2>',
              re.I | re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Mission accordion h2 was not found; refusing to claim a fix.')

          attrs = match.group('attrs') + match.group('rest')
          attrs = re.sub(r'\s*\bid\s*=\s*(?:["\']?(?:Misson|Mission)["\']?)', '', attrs, flags=re.I)
          attrs = re.sub(r'\s+role\s*=\s*["\'][^"\']*["\']', '', attrs, flags=re.I)
          attrs = re.sub(r'\s+aria-[a-z-]+\s*=\s*["\'][^"\']*["\']', '', attrs, flags=re.I)
          attrs = re.sub(r'\s+tabindex\s*=\s*["\'][^"\']*["\']', '', attrs, flags=re.I)
          replacement = f'<header{attrs} id="Mission">{match.group("body")}</header>'
          text = text[:match.start()] + replacement + text[match.end():]

          if re.search(r'<h2[^>]*\bid\s*=\s*["\']?(?:Misson|Mission)', text, re.I):
              raise SystemExit('Old Mission h2 still present after replacement.')
          if '<header' not in replacement or 'id="Mission"' not in replacement:
              raise SystemExit('Replacement verification failed.')

          home.write_text(text, encoding='utf-8')
          PY

      - name: Commit actual source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pagespeed-audits.yml .github/fix-pagespeed-audits-trigger
          git add index.html llms.txt
          git diff --cached --check
          git commit -m "Fix PageSpeed llms and accordion ARIA audits"
          git push origin main
