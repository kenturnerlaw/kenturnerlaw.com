name: Standardize header menu and traffic CTAs
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply standard header and traffic CTA updates
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          home = Path('index.html').read_text()
          traffic_path = Path('traffic-tickets/index.html')
          traffic = traffic_path.read_text()

          # Copy the homepage header and sidebar markup exactly.
          header_match = re.search(r'(<header class="ampstart-headerbar kt-home-header fixed left-0 right-0 top-0">.*?</header>)', home, re.S)
          sidebar_match = re.search(r'(<!--SIDEBAR-->.*?<!--SIDEBAR END-->)', home, re.S)
          if not header_match or not sidebar_match:
              raise SystemExit('Could not locate canonical homepage header/sidebar')
          header = header_match.group(1)
          sidebar = sidebar_match.group(1)

          # Traffic page needs amp-sidebar support.
          if 'custom-element="amp-sidebar"' not in traffic:
              traffic = traffic.replace(
                  '<script async src="https://cdn.ampproject.org/v0.js"></script>',
                  '<script async src="https://cdn.ampproject.org/v0.js"></script>\n  <script async custom-element="amp-sidebar" src="https://cdn.ampproject.org/v0/amp-sidebar-0.1.js"></script>',
                  1
              )

          # Replace the traffic page's custom header with the canonical homepage header.
          traffic = re.sub(r'<header class="site-header">.*?</header>', header, traffic, count=1, flags=re.S)

          # Insert the canonical menu immediately after the header when absent.
          if 'id="header-sidebar"' not in traffic:
              traffic = traffic.replace(header, header + '\n\n' + sidebar, 1)

          # Add the exact homepage header/menu visual rules to this standalone page.
          standard_css = r'''
    /* Canonical site header/menu — matches homepage */
    .fixed{position:fixed}.left-0{left:0}.right-0{right:0}.top-0{top:0}.flex{display:flex}.items-center{align-items:center}.justify-start{justify-content:flex-start}.items-start{align-items:flex-start}.px3{padding-left:1.5rem;padding-right:1.5rem}.m0{margin:0}.p0{padding:0}.list-reset{list-style:none}
    .ampstart-headerbar{z-index:999}.kt-home-header{height:4.25rem;padding:0 .8rem;display:grid;grid-template-columns:3rem 1fr auto;gap:.5rem;align-items:center;background-color:transparent;background-image:var(--leather);background-size:cover;background-repeat:no-repeat;background-position:center;border-bottom:1px solid rgba(255,255,255,.08);box-shadow:none}
    .ampstart-navbar-trigger{cursor:pointer;font-size:1.75rem;line-height:1;padding:.65rem .4rem;text-align:center;color:#d8dade;-webkit-text-fill-color:#d8dade;text-shadow:0 -1px 0 rgba(0,0,0,.68),0 1px 0 rgba(255,255,255,.34)}
    .kt-home-brand{min-width:0;text-align:center;text-decoration:none;line-height:1.05;letter-spacing:.1em;text-transform:uppercase}.kt-home-brand strong{display:block;font-family:Georgia,'Times New Roman',serif;font-size:1rem;font-weight:700;color:#d7d9dc;background:linear-gradient(180deg,#f4f5f6 0%,#d9dbde 28%,#a9adb2 52%,#eceeef 72%,#b7bbc0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.2px rgba(76,80,86,.72);filter:none;text-shadow:0 -1px 0 rgba(0,0,0,.50),0 1px 0 rgba(255,255,255,.22)}.kt-home-brand small{display:block;margin-top:.22rem;color:#f4efe2;font-family:Arial,sans-serif;font-size:.56rem;letter-spacing:.16em}
    .kt-header-call{padding:.65rem .85rem;border:1px solid rgba(255,255,255,.24);border-radius:999px;color:#fff;-webkit-text-fill-color:#fff;font-family:Arial,sans-serif;font-size:.72rem;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap;background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 28%,rgba(0,0,0,.26)),var(--leather);background-size:cover;background-position:center;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 4px rgba(0,0,0,.24),0 4px 10px rgba(0,0,0,.35)}
    .ampstart-sidebar{background-color:#030303;background-image:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.3)),var(--leather);background-size:auto,440px 440px;color:#fff;min-width:300px;width:300px;border-right:1px solid #8f6b1f;box-shadow:10px 0 30px rgba(0,0,0,.7)}.ampstart-sidebar-header{line-height:3.5rem;min-height:3.5rem}.kt-sidebar-menu{padding-bottom:1rem}.ampstart-sidebar .kt-sidebar-section{margin:0 0 1.15rem}.kt-sidebar-parent{display:block;color:#c99537;text-decoration:none;font-weight:700;letter-spacing:.01em;text-shadow:0 -1px 0 #2a1603,0 1px 0 #f7dea0,1px 2px 0 #65400e,0 4px 4px #000}.kt-sidebar-sub{list-style:none;margin:.5rem 0 0 .65rem;padding:0 0 0 .75rem;border-left:1px solid rgba(201,149,55,.48)}.kt-sidebar-sub li{margin:0 0 .45rem;padding:0}.kt-sidebar-sub a{color:#f2eee4;text-decoration:none;font-size:.88rem;line-height:1.3}.kt-sidebar-action{margin-top:1.45rem}
    body{padding-top:4.25rem}
    @media(min-width:48rem){.kt-home-header{grid-template-columns:4rem 1fr 9rem;padding:0 1.25rem}.kt-home-brand strong{font-size:1.25rem}.kt-header-call{text-align:center;font-size:.8rem}}
'''
          if 'Canonical site header/menu' not in traffic:
              traffic = traffic.replace('</style>', standard_css + '\n  </style>', 1)

          # Correct traffic-page CTA labels and number.
          traffic = traffic.replace('href="tel:+12394003733">Call (239) 400-FREE</a>', 'href="tel:+12397443434">Call Now (239) 744-3434</a>')
          traffic = traffic.replace('>Schedule a Call</a>', '>Call Scheduling Tool</a>')

          traffic_path.write_text(traffic)

          # Keep the scheduler terminology consistent in the homepage menu/action label too.
          home_path = Path('index.html')
          h = home_path.read_text()
          h = h.replace('>Schedule a Call</a>', '>Call Scheduling Tool</a>')
          home_path.write_text(h)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html traffic-tickets/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Standardize site header menu and traffic call actions"
            git push origin main
          fi
          git rm .github/workflows/standardize-header-menu.yml
          git commit -m "Remove one-time header standardization workflow"
          git push origin main
