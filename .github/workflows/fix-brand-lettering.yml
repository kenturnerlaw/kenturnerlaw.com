name: Fix brand lettering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-brand-lettering.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove offset brand shadows
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = ".kt-home-rebuild .kt-home-brand strong{display:block;font-size:1rem;font-weight:700;color:#c9ccd1;background:linear-gradient(180deg,#f7f8f9 0%,#d8dade 24%,#8f949b 48%,#e7e9eb 67%,#a9adb3 82%,#737880 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:none;text-shadow:0 -1px 0 rgba(0,0,0,.92),0 1px 0 rgba(255,255,255,.58),0 2px 1px rgba(0,0,0,.58)}"
          new = ".kt-home-rebuild .kt-home-brand strong{display:block;font-size:1rem;font-weight:700;color:#d7d9dc;background:linear-gradient(180deg,#f4f5f6 0%,#d9dbde 28%,#a9adb2 52%,#eceeef 72%,#b7bbc0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.2px rgba(76,80,86,.72);filter:none;text-shadow:none}"
          if old not in s:
              raise SystemExit('Current brand rule not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit clean brand lettering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove doubled shadows from header brand"
          git push origin main
