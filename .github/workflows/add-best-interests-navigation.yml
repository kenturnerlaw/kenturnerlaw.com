name: Add Best Interests navigation

on:
  push:
    paths:
      - '.github/workflows/add-best-interests-navigation.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Best Interests links and menus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          LINK = '<li><a href="/best-interests-of-the-child-florida/">Best Interests of the Child</a></li>'
          ABS_LINK = '<li><a href="https://www.kenturnerlaw.com/best-interests-of-the-child-florida/" target="_self">Best Interests of the Child</a></li>'
          changed=[]

          def add_after_child_custody(text, absolute=False):
              if 'best-interests-of-the-child-florida' in text:
                  return text
              link = ABS_LINK if absolute else LINK
              patterns = [
                  r'(<li><a[^>]+href=["\'](?:https://www\.kenturnerlaw\.com)?/child-custody/["\'][^>]*>.*?</a></li>)',
                  r'(<li><a[^>]+href=["\'](?:https://www\.kenturnerlaw\.com)?/divorce/["\'][^>]*>.*?</a></li>)'
              ]
              for pat in patterns:
                  out,n = re.subn(pat, r'\1\n              '+link, text, count=1, flags=re.I|re.S)
                  if n:
                      return out
              return text

          # Main site pages: add under Family Law navigation wherever possible.
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or path.as_posix().startswith('florida-criminal-defense-answers/'):
                  continue
              original=path.read_text(encoding='utf-8')
              updated=original
              if 'Family Law' in updated or path.name=='index.html' or path.parent.name in {'divorce','child-custody','best-interests-of-the-child-florida'}:
                  updated=add_after_child_custody(updated, absolute='https://www.kenturnerlaw.com/' in updated)
              if updated!=original:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))

          # Add a consistent compact menu to standalone Answer Center pages and the Best Interests page.
          menu='''<nav class="site-menu" aria-label="Site navigation"><a href="/">Home</a><a href="/criminal-defense/">Criminal Defense</a><a href="/florida-criminal-defense-answers/">Criminal Defense Answers</a><a href="/divorce/">Divorce</a><a href="/child-custody/">Time-Sharing</a><a href="/best-interests-of-the-child-florida/">Best Interests of the Child</a><a href="/reviews/">Reviews</a></nav>'''
          css='''.site-menu{display:flex;flex-wrap:wrap;gap:10px 18px;padding:12px 0 4px;border-top:1px solid #6f5526;border-bottom:1px solid #6f5526;margin-top:14px}.site-menu a{color:#efd98c;text-decoration:none}.site-menu a:hover,.site-menu a:focus{text-decoration:underline}'''

          targets=list(Path('florida-criminal-defense-answers').rglob('index.html'))+[Path('best-interests-of-the-child-florida/index.html')]
          for path in targets:
              if not path.exists():
                  continue
              original=path.read_text(encoding='utf-8')
              updated=original
              if '.site-menu{' not in updated:
                  updated=re.sub(r'(</style>)', css+r'\1', updated, count=1, flags=re.I)
              if 'aria-label="Site navigation"' not in updated:
                  if re.search(r'</header>', updated, flags=re.I):
                      updated=re.sub(r'</header>', menu+'\n</header>', updated, count=1, flags=re.I)
                  else:
                      updated=re.sub(r'(<body[^>]*>)', r'\1\n<header>'+menu+'</header>', updated, count=1, flags=re.I)
              if updated!=original:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for f in sorted(set(changed)):
              print(f)
          PY

      - name: Commit navigation updates and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-best-interests-navigation.yml
          git add -- '*.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Add Best Interests page to menus and standalone page navigation"
          git push origin main
