name: Fix homepage hero and CTAs

on:
  push:
    branches: [main]
    paths:
      - '.github/fix-homepage-hero-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply targeted homepage fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = [
              ("body{color:#f7f1e4;background-color:#030303;background-image:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.14)),var(--kt-leather);background-size:auto,520px 520px;background-repeat:repeat;background-attachment:fixed;font-family:'Playfair Display SC',Georgia,serif;line-height:1.6;-webkit-font-smoothing:antialiased}",
               "body{color:#f7f1e4;background-color:#020202;background-image:linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,.42)),var(--kt-leather);background-size:auto,520px 520px;background-repeat:repeat;background-attachment:fixed;font-family:'Playfair Display SC',Georgia,serif;line-height:1.6;-webkit-font-smoothing:antialiased}"),
              ("body.kt-home-rebuild .kt-home-hero{position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.08);background-color:#050505;background-image:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.22)),var(--kt-leather);background-size:cover;background-repeat:no-repeat;background-position:center top}",
               "body.kt-home-rebuild .kt-home-hero{position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.08);background-color:#020202;background-image:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.54)),var(--kt-leather);background-size:auto,520px 520px;background-repeat:repeat;background-position:center}"),
              ("body.kt-home-rebuild .kt-home-hero-media{position:absolute;inset:0;opacity:.18}",
               "body.kt-home-rebuild .kt-home-hero-media{position:absolute;inset:0;opacity:.07}"),
              ("body.kt-home-rebuild .kt-home-action{display:block;padding:.85rem 1rem;border:1px solid #94691d;font-family:Arial,sans-serif;font-size:.86rem;font-weight:700;letter-spacing:.04em;text-decoration:none;text-transform:uppercase}",
               "body.kt-home-rebuild .kt-home-action{display:block;padding:.9rem 1rem;border:1px solid rgba(255,255,255,.24);border-radius:999px;font-family:Arial,sans-serif;font-size:.86rem;font-weight:700;letter-spacing:.04em;text-decoration:none;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 5px rgba(0,0,0,.34),0 6px 14px rgba(0,0,0,.46)}"),
              ("body.kt-home-rebuild .kt-home-action-primary{color:#171006;background:linear-gradient(180deg,#fff0a3 0%,#e6c45e 18%,#b98525 50%,#e4c15d 70%,#8b5f18 100%);text-shadow:0 1px 0 rgba(255,245,194,.72),0 2px 2px rgba(58,34,4,.5);box-shadow:0 7px 15px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,221,.78)}",
               "body.kt-home-rebuild .kt-home-action-primary{color:#fff;-webkit-text-fill-color:#fff;background-color:#080808;background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 28%,rgba(0,0,0,.30)),var(--kt-leather);background-size:auto,520px 520px;text-shadow:none}"),
              ("body.kt-home-rebuild .kt-home-action-secondary{color:#efd77e;background-color:#040404;background-image:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.3)),var(--kt-leather);background-size:auto,360px 360px;box-shadow:inset 0 0 0 1px rgba(255,224,125,.13),0 7px 15px rgba(0,0,0,.58)}",
               "body.kt-home-rebuild .kt-home-action-secondary{color:#fff;-webkit-text-fill-color:#fff;background-color:#080808;background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 28%,rgba(0,0,0,.30)),var(--kt-leather);background-size:auto,520px 520px;text-shadow:none}"),
              ("<a class=\"kt-home-action kt-home-action-primary\" href=\"tel:+12394003733\">Call (239) 400-FREE</a>",
               "<a class=\"kt-home-action kt-home-action-primary\" href=\"tel:+12394003733\">Call Now (239)400-FREE</a>"),
              ("<a class=\"kt-home-action kt-home-action-secondary\" href=\"https://kenturnerlaw.as.me/\" target=\"_blank\" rel=\"noopener\">Schedule a Call</a>",
               "<a class=\"kt-home-action kt-home-action-secondary\" href=\"https://kenturnerlaw.as.me/\" target=\"_blank\" rel=\"noopener\">Schedule a Call Here</a>"),
              ("      <li><a href=\"/criminal-defense-miami/\">Miami / Miami-Dade County</a></li>\n      <li><a href=\"/criminal-defense-naples/\">Naples / Collier County</a></li>\n      <li><a href=\"/criminal-defense-fort-myers/\">Fort Myers / Lee County</a></li>\n      <li><a href=\"/criminal-defense-labelle/\">LaBelle / Hendry County</a></li>",
               "      <li><a href=\"/criminal-defense-naples/\">Naples / Collier County</a></li>\n      <li><a href=\"/criminal-defense-fort-myers/\">Fort Myers / Lee County</a></li>\n      <li><a href=\"/criminal-defense-labelle/\">LaBelle / Hendry County</a></li>\n      <li><a href=\"/criminal-defense-miami/\">Miami / Miami-Dade County</a></li>")
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:110]}')
              s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Verify requested labels and order
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text()
          assert 'Call Now (239)400-FREE' in s
          assert 'Schedule a Call Here' in s
          block = s[s.index('Criminal Defense Locations'):s.index('Family Law', s.index('Criminal Defense Locations'))]
          order = ['Naples / Collier County','Fort Myers / Lee County','LaBelle / Hendry County','Miami / Miami-Dade County']
          positions = [block.index(x) for x in order]
          assert positions == sorted(positions)
          assert 'background-size:auto,520px 520px;background-repeat:repeat;background-position:center' in s

      - name: Commit homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Fix homepage leather CTAs and location order"
          git push origin main
