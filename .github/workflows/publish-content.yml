name: Publish content pages

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'tools/publish/**'
      - '.github/workflows/publish-content.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional reason'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build published AMP pages
        run: node tools/publish/build.js

      - name: Run publish tooling tests
        run: node tools/publish/test.js

      - name: Validate generated AMP pages
        run: node tools/publish/validate-amp.js

      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            florida-criminal-defense-answers \
            updates \
            blog/index.html \
            sitemap.xml \
            sitemap.txt \
            search/index.json \
            llms.txt \
            content/posts || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Publish generated AMP pages and indexes"
            git push
          fi
