name: Publish content pages

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.shtml'
      - 'content/posts/**'
      - 'tools/publish/**'
      - 'tools/seo/**'
      - 'scripts/**'
      - 'child-support-calculator/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '_redirects'
      - 'package.json'
      - '.github/workflows/publish-content.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional reason'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install publisher dependencies
        run: npm ci --no-audit --no-fund

      - name: Check publisher syntax
        run: |
          node --check tools/publish/build-v2.js
          node --check tools/publish/enhance-seo.js
          node --check tools/publish/update-answer-menus.js
          node --check tools/publish/repair-sitewide-amp.js
          node --check tools/publish/validate-amp.js
          node --check scripts/sync-home-template.mjs
          node --check scripts/build-child-support-amp.mjs
          node --check scripts/test-child-support-calculator.mjs
          node --check child-support-calculator/calculator.js
          node --check functions/api/publish.js

      - name: Build published AMP pages and automatic SEO
        run: npm run build:content

      - name: Build child support calculator as AMP
        run: node scripts/build-child-support-amp.mjs

      - name: Functionally test child support calculator
        run: node scripts/test-child-support-calculator.mjs

      - name: Update article hub menus
        run: node tools/publish/update-answer-menus.js

      - name: Repair AMP markup sitewide
        run: npm run repair:amp

      - name: Apply current homepage design to every public AMP page
        run: node scripts/sync-home-template.mjs

      - name: Normalize and audit public-page SEO
        run: |
          npm run normalize:seo
          npm run audit:seo

      - name: Validate every AMP page sitewide
        run: npm run validate:amp

      - name: Commit generated themed and validated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)**/index.html' child-support-calculator/calculator-amp.js sitemap.xml sitemap.txt search/published.json content/posts package-lock.json || true
          if git diff --cached --quiet; then
            echo "No generated, themed, or repaired changes to commit."
          else
            git commit -m "Publish content with managed site theme"
            git push
          fi
