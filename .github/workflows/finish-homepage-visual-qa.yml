name: Finish homepage visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/finish-homepage-visual-qa-trigger'

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finish homepage visual details
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = [
              (
                  "background-size:auto,520px 520px}",
                  "background-size:auto,auto}",
                  1,
                  "interior hero leather sizing",
              ),
              (
                  "background-size:auto,380px 380px;box-shadow:",
                  "background-size:auto,auto;box-shadow:",
                  1,
                  "interior CTA leather sizing",
              ),
              (
                  "background-size:100% 100%,100% 100%,420px 420px}details.kt-acc>summary:after",
                  "background-size:100% 100%,100% 100%,auto}details.kt-acc>summary:after",
                  1,
                  "mobile accordion leather sizing",
              ),
          ]

          for old, new, expected, label in replacements:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} match, found {count}')
              s = s.replace(old, new)

          # Put the address and Client Resources button at the true bottom of main content.
          start = s.find('<section class="kt-location-section">')
          if start == -1:
              raise SystemExit('location section not found')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('location section end not found')
          end += len('</section>')
          location = s[start:end]
          s = s[:start] + s[end:]

          main_close = s.find('</main>')
          if main_close == -1:
              raise SystemExit('main closing tag not found')
          s = s[:main_close] + '\n\n' + location + '\n' + s[main_close:]

          # Guard the approved homepage details.
          checks = {
              'hero call label': '<a class="kt-home-action kt-home-action-primary" href="tel:+12394003733">Call Now (239)400-FREE</a>',
              'schedule label': '>Schedule a Call Here</a>',
              'single free consultation': '<p class="kt-free-consultation">Free Consultation</p>',
              'location Naples': '/criminal-defense-naples/">Naples / Collier County</a>',
              'location Fort Myers': '/criminal-defense-fort-myers/">Fort Myers / Lee County</a>',
              'location LaBelle': '/criminal-defense-labelle/">LaBelle / Hendry County</a>',
              'location Miami': '/criminal-defense-miami/">Miami / Miami-Dade County</a>',
          }
          for label, needle in checks.items():
              if needle not in s:
                  raise SystemExit(f'missing approved detail: {label}')
          if s.count('<p class="kt-free-consultation">Free Consultation</p>') != 1:
              raise SystemExit('Free Consultation must appear exactly once in the hero')

          order = [s.index(checks[k]) for k in ['location Naples','location Fort Myers','location LaBelle','location Miami']]
          if order != sorted(order):
              raise SystemExit('location order is not Naples, Fort Myers, LaBelle, Miami')

          if s.rfind('<section class="kt-location-section">') < s.rfind('<section id="legal-resources">'):
              raise SystemExit('location section is not below Legal Resources')

          p.write_text(s)

      - name: Sync managed design sitewide
        run: node scripts/sync-home-template.mjs
      - name: Install AMP validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate all AMP pages
        run: npm run validate:amp -- --amp-only
      - name: Commit validated visual finish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' ':(glob)**/*.html'
          if git diff --cached --quiet; then
            echo "No visual-finish changes were necessary"
            exit 0
          fi
          git commit -m "Finish homepage visual details and natural leather sizing"
          git push origin main
