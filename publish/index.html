<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#000000">
<title>Login</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 18px 40px;
  background:#050505 url('/dark-leather.webp');color:#fff;
  font-family:Georgia,"Times New Roman",serif;line-height:1.45
}
h1{color:#e4c36a;font-size:1.4rem;margin:1.5rem 0 1rem;font-weight:400;letter-spacing:.04em}
label{display:block;margin:1rem 0 .35rem;color:#cfcfcf;font-size:.95rem}
input[type=text],input[type=password],textarea,select{
  width:100%;font:inherit;font-size:1.05rem;line-height:1.4;
  padding:14px 12px;border:1px solid #5a5a5a;border-radius:3px;
  background:#111;color:#fff;-webkit-appearance:none;appearance:none
}
textarea{min-height:220px;resize:vertical}
.row{display:flex;gap:10px}
.row>div{flex:1}
.type-row{display:flex;gap:14px;margin:.35rem 0 0}
.type-row label{display:flex;align-items:center;gap:.45rem;margin:0;color:#fff;font-size:1rem}
button{
  display:block;width:100%;margin-top:1.25rem;padding:14px;
  border:1px solid #e4c36a;background:#000;color:#e4c36a;
  font:inherit;font-size:1.05rem;cursor:pointer
}
button:disabled{opacity:.55;cursor:wait}
button.secondary{margin-top:.7rem;border-color:#555;color:#bbb;font-size:.95rem}
.status{margin-top:1rem;min-height:1.2em;font-size:.92rem;color:#ddd}
.status.ok{color:#8dca9a}
.status.err{color:#e89a9a}
.hidden{display:none}
.wrap{max-width:420px;margin:0 auto}
.hint{color:#aaa;font-size:.88rem;margin:.5rem 0 0;line-height:1.35}
</style>
</head>
<body>
<div class="wrap">
  <section id="gate">
    <h1>Login</h1>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button type="button" id="signin">Sign in</button>
    <div id="gate-status" class="status" aria-live="polite"></div>
  </section>

  <section id="app" class="hidden">
    <h1>New post</h1>
    <p class="hint">Write here, tap <strong>Copy for Cursor</strong>, paste into your Ken Turner Law Cursor chat, send. Cursor publishes it. Nothing to open on GitHub.</p>
    <form id="publish-form">
      <div class="type-row">
        <label><input type="radio" name="type" value="answer" checked> Question</label>
        <label><input type="radio" name="type" value="update"> Update</label>
      </div>
      <label for="title">Title</label>
      <input id="title" type="text" required maxlength="180">
      <label for="body">Text</label>
      <textarea id="body" required placeholder="Dictate or paste from Notes"></textarea>
      <div class="row">
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="">—</option>
            <option>Police encounters</option>
            <option>Searches</option>
            <option>Arrest and court</option>
            <option>DUI</option>
            <option>Drug charges</option>
            <option>Domestic violence</option>
            <option>Traffic</option>
            <option>Family law</option>
            <option>General</option>
          </select>
        </div>
        <div>
          <label for="county">County</label>
          <select id="county">
            <option value="">—</option>
            <option>Collier</option>
            <option>Lee</option>
            <option>Hendry</option>
            <option>Miami-Dade</option>
          </select>
        </div>
      </div>
      <button type="submit" id="submit">Copy for Cursor</button>
      <button type="button" class="secondary" id="signout">Sign out</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
  </section>
</div>
<script>
(function () {
  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var gateStatus = document.getElementById('gate-status');
  var statusEl = document.getElementById('status');
  var form = document.getElementById('publish-form');
  var submit = document.getElementById('submit');

  function setGate(msg, cls) {
    gateStatus.textContent = msg || '';
    gateStatus.className = 'status' + (cls ? ' ' + cls : '');
  }
  function setStatus(msg, cls) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }
  function showApp() {
    gate.classList.add('hidden');
    app.classList.remove('hidden');
    setGate('');
  }
  function showGate() {
    app.classList.add('hidden');
    gate.classList.remove('hidden');
    document.getElementById('password').value = '';
  }

  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.signedIn) showApp(); })
    .catch(function () {});

  document.getElementById('signin').onclick = async function () {
    var password = document.getElementById('password').value;
    if (!password) { setGate('Enter password.', 'err'); return; }
    setGate('Signing in…');
    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || 'Sign in failed');
      showApp();
    } catch (e) {
      setGate(e.message || String(e), 'err');
    }
  };

  document.getElementById('password').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') document.getElementById('signin').click();
  });

  document.getElementById('signout').onclick = async function () {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
    showGate();
    setGate('Signed out.');
  };

  form.onsubmit = async function (ev) {
    ev.preventDefault();
    var title = document.getElementById('title').value.trim();
    var body = document.getElementById('body').value.trim();
    var type = (form.querySelector('input[name="type"]:checked') || {}).value || 'answer';
    var category = document.getElementById('category').value;
    var county = document.getElementById('county').value;
    if (!title || !body) { setStatus('Title and text required.', 'err'); return; }

    var lines = [
      'Publish this on kenturnerlaw.com:',
      '',
      'Type: ' + (type === 'update' ? 'Update' : 'Question'),
      'Title: ' + title,
      category ? 'Category: ' + category : '',
      county ? 'County: ' + county : '',
      '',
      body
    ].filter(function (line, i, arr) {
      // keep blank line before body; drop empty optional fields
      return line !== '' || (i > 0 && arr[i - 1].indexOf(':') === 0) || i === arr.length - 2;
    });
    // Simpler join without fancy filter:
    lines = [
      'Publish this on kenturnerlaw.com:',
      '',
      'Type: ' + (type === 'update' ? 'Update' : 'Question'),
      'Title: ' + title
    ];
    if (category) lines.push('Category: ' + category);
    if (county) lines.push('County: ' + county);
    lines.push('', body);

    var text = lines.join('\n');
    submit.disabled = true;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        setStatus('Copied. Paste into your Cursor Ken Turner Law chat and send.', 'ok');
      } else {
        // Fallback select
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setStatus('Copied. Paste into your Cursor Ken Turner Law chat and send.', 'ok');
      }
    } catch (e) {
      setStatus('Could not copy. Select and copy from your Notes, then paste in Cursor.', 'err');
    } finally {
      submit.disabled = false;
    }
  };
})();
</script>
</body>
</html>
