<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#000000">
<title>Login</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 18px 40px;
  background:#050505 url('/dark-leather.webp');color:#fff;
  font-family:Georgia,"Times New Roman",serif;line-height:1.45
}
h1{color:#e4c36a;font-size:1.4rem;margin:1.5rem 0 1rem;font-weight:400;letter-spacing:.04em}
label{display:block;margin:1rem 0 .35rem;color:#cfcfcf;font-size:.95rem}
input[type=text],input[type=password],textarea,select{
  width:100%;font:inherit;font-size:1.05rem;line-height:1.4;
  padding:14px 12px;border:1px solid #5a5a5a;border-radius:3px;
  background:#111;color:#fff;-webkit-appearance:none;appearance:none
}
textarea{min-height:220px;resize:vertical}
.row{display:flex;gap:10px}
.row>div{flex:1}
.type-row{display:flex;gap:14px;margin:.35rem 0 0}
.type-row label{display:flex;align-items:center;gap:.45rem;margin:0;color:#fff;font-size:1rem}
button{
  display:block;width:100%;margin-top:1.25rem;padding:14px;
  border:1px solid #e4c36a;background:#000;color:#e4c36a;
  font:inherit;font-size:1.05rem;cursor:pointer
}
button:disabled{opacity:.55;cursor:wait}
button.secondary{margin-top:.7rem;border-color:#555;color:#bbb;font-size:.95rem}
.status{margin-top:1rem;min-height:1.2em;font-size:.92rem;color:#ddd}
.status.ok{color:#8dca9a}
.status.err{color:#e89a9a}
.hint{font-size:.85rem;color:#aaa;margin:.35rem 0 0}
.hint a{color:#e4c36a}
.hidden{display:none}
.wrap{max-width:420px;margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
  <section id="gate">
    <h1>Login</h1>
    <label for="token">GitHub access token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <p class="hint">Paste once. Saved on this iPhone only. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create token</a> → this repo only → Contents: Read and write.</p>
    <button type="button" id="unlock">Sign in</button>
    <div id="gate-status" class="status" aria-live="polite"></div>
  </section>

  <section id="app" class="hidden">
    <h1>New post</h1>
    <form id="publish-form" autocomplete="on">
      <div class="type-row" role="radiogroup" aria-label="Type">
        <label><input type="radio" name="type" value="answer" checked> Question</label>
        <label><input type="radio" name="type" value="update"> Update</label>
      </div>

      <label for="title">Title</label>
      <input id="title" name="title" type="text" required maxlength="180" enterkeyhint="next">

      <label for="body">Text</label>
      <textarea id="body" name="body" required placeholder="Dictate or paste from Notes"></textarea>

      <div class="row">
        <div>
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">—</option>
            <option>Police encounters</option>
            <option>Searches</option>
            <option>Arrest and court</option>
            <option>DUI</option>
            <option>Drug charges</option>
            <option>Domestic violence</option>
            <option>Traffic</option>
            <option>Family law</option>
            <option>General</option>
          </select>
        </div>
        <div>
          <label for="county">County</label>
          <select id="county" name="county">
            <option value="">—</option>
            <option>Collier</option>
            <option>Lee</option>
            <option>Hendry</option>
            <option>Miami-Dade</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submit">Post</button>
      <button type="button" class="secondary" id="lock">Sign out</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
  </section>
</div>

<script>
(function () {
  var STORE = 'ktGithubToken';
  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var tokenInput = document.getElementById('token');
  var gateStatus = document.getElementById('gate-status');
  var form = document.getElementById('publish-form');
  var statusEl = document.getElementById('status');
  var submit = document.getElementById('submit');
  var token = '';

  function setGateStatus(msg, cls) {
    gateStatus.textContent = msg || '';
    gateStatus.className = 'status' + (cls ? ' ' + cls : '');
  }
  function setStatus(msg, cls) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function showApp(t) {
    token = t;
    try { localStorage.setItem(STORE, t); } catch (e) {}
    gate.classList.add('hidden');
    app.classList.remove('hidden');
    setGateStatus('');
    setStatus('');
  }

  function showGate() {
    token = '';
    try { localStorage.removeItem(STORE); } catch (e) {}
    app.classList.add('hidden');
    gate.classList.remove('hidden');
    tokenInput.value = '';
  }

  try {
    var saved = localStorage.getItem(STORE);
    if (saved) showApp(saved);
  } catch (e) {}

  document.getElementById('unlock').addEventListener('click', function () {
    var t = tokenInput.value.trim();
    if (!t) {
      setGateStatus('Paste your GitHub access token.', 'err');
      return;
    }
    showApp(t);
  });

  tokenInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      document.getElementById('unlock').click();
    }
  });

  document.getElementById('lock').addEventListener('click', function () {
    showGate();
    setGateStatus('Signed out.');
  });

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var title = document.getElementById('title').value.trim();
    var body = document.getElementById('body').value.trim();
    var type = (form.querySelector('input[name="type"]:checked') || {}).value || 'answer';
    var category = document.getElementById('category').value;
    var county = document.getElementById('county').value;

    if (!token) {
      showGate();
      setGateStatus('Sign in first.', 'err');
      return;
    }
    if (!title || !body) {
      setStatus('Title and text are required.', 'err');
      return;
    }

    submit.disabled = true;
    setStatus('Posting…');

    try {
      var res = await fetch('/api/publish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: title,
          body: body,
          type: type,
          category: category,
          county: county,
          token: token
        })
      });
      var data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          showGate();
          throw new Error(data.error || 'Sign in failed. Check the token.');
        }
        throw new Error(data.error || ('Failed (' + res.status + ')'));
      }
      setStatus('Posted: ' + (data.url || data.path), 'ok');
      form.reset();
      var radio = form.querySelector('input[name="type"][value="' + type + '"]');
      if (radio) radio.checked = true;
    } catch (err) {
      setStatus(err.message || String(err), 'err');
    } finally {
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
