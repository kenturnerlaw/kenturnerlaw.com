<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#050505">
<title>Ken Turner Law Publisher</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505 url('/dark-leather.webp');color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.45;padding:max(14px,env(safe-area-inset-top)) 14px 48px;min-height:100vh}.wrap{max-width:720px;margin:auto}.panel{background:rgba(7,7,7,.94);border:1px solid #8b6b2e;padding:18px;margin:0 0 16px;box-shadow:0 8px 28px rgba(0,0,0,.35)}h1,h2{font-family:Georgia,"Times New Roman",serif;margin:.2rem 0 1rem;color:#e4c36a}h1{font-size:1.7rem}h2{font-size:1.25rem}label{display:block;font-weight:700;margin:14px 0 5px;color:#fff}input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #8b6b2e;background:#111;color:#fff;border-radius:2px}input::placeholder,textarea::placeholder{color:#aaa}select option{background:#111;color:#fff}textarea{min-height:260px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.toolbar button{width:auto;margin:0;padding:8px 11px;background:#171717;color:#e4c36a;border:1px solid #8b6b2e}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}button,.btn{display:block;width:100%;padding:13px;border:1px solid #e4c36a;background:#e4c36a;color:#050505;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;margin-top:14px}.secondary{background:#171717;color:#fff;border-color:#8b6b2e}.danger{background:#8b1e1e;color:#fff;border-color:#b33}.hidden{display:none!important}.status{min-height:1.4em;margin-top:10px}.ok{color:#7ee08f}.err{color:#ff8d8d}.hint,.meta{font-size:.9rem;color:#c7c7c7}.article{border-top:1px solid #57451f;padding:14px 0}.article:first-child{border-top:0}.article-title{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;font-weight:700;color:#e4c36a}.article-actions{display:flex;gap:8px;flex-wrap:wrap}.article-actions button,.article-actions a{width:auto;margin:8px 0 0;padding:8px 10px;font-size:.9rem}.search{margin-bottom:10px}.publisher-version{text-align:center;color:#c8ad65;font-size:.82rem;margin:16px 0 0;letter-spacing:.02em}@media(max-width:560px){.row{grid-template-columns:1fr}.panel{padding:15px}body{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="wrap">
<section id="gate" class="panel">
<h1>Publisher</h1>
<p class="hint">Sign in with the GitHub account connected to this website.</p>
<button id="signin" type="button">Sign in with GitHub</button>
<form id="setup-form" class="hidden" action="https://github.com/settings/apps/new" method="post"><input type="hidden" name="manifest" id="manifest"></form>
<div id="gate-status" class="status" aria-live="polite"></div>
</section>
<section id="app" class="hidden">
<div class="panel">
<h1 id="form-heading">New Article</h1>
<p id="who" class="hint"></p>
<form id="publish-form">
<input id="original-slug" type="hidden">
<label for="practice">Practice area</label>
<select id="practice" required><option value="criminal-defense">Criminal Defense</option><option value="family-law">Family Law</option><option value="traffic">Traffic Tickets</option><option value="general">General Legal Information</option><option value="updates">Legal Update</option></select>
<div class="row"><div><label for="category">Category</label><select id="category"></select></div><div><label for="county">County <span class="hint">(optional)</span></label><select id="county"><option value="">None</option><option>Collier</option><option>Lee</option><option>Hendry</option><option>Miami-Dade</option></select></div></div>
<label for="title">Headline</label><input id="title" type="text" required maxlength="180">
<label for="body">Article</label><div class="toolbar"><button type="button" data-wrap="**">Bold</button><button type="button" data-wrap="_">Italic</button><button type="button" id="add-link">Add Link</button></div>
<textarea id="body" required placeholder="Write, dictate, or paste the article here."></textarea><p class="hint">Links use: [linked words](https://example.com)</p>
<div class="actions"><button type="submit" id="submit">Publish</button><button type="button" class="secondary hidden" id="cancel-edit">Cancel Edit</button></div><button type="button" class="secondary" id="signout">Sign Out</button>
</form><div id="status" class="status" aria-live="polite"></div>
</div>
<div class="panel"><h2>Published Articles</h2><input id="search" class="search" type="search" placeholder="Search articles"><div id="articles"><p class="hint">Loading articles…</p></div></div>
</section>
<p id="publisher-version" class="publisher-version" data-version="2.2.0">Publisher v2.2.0 • SEO/AMP/Menu update</p>
</div>
<script>
(function(){var SITE='https://www.kenturnerlaw.com';var categories={'criminal-defense':['','Police encounters','Searches','Arrest and court','DUI','Drug charges','Domestic violence','General'],'family-law':['','Divorce','Child custody','Child support','Parenting plans','Paternity','Modification','Relocation','Domestic violence','General'],'traffic':['','Traffic','Suspended license','DUI','General'],'general':['','General'],'updates':['','General']};var posts=[];var gate=document.getElementById('gate'),app=document.getElementById('app'),statusEl=document.getElementById('status'),gateStatus=document.getElementById('gate-status'),form=document.getElementById('publish-form'),submit=document.getElementById('submit');function setStatus(msg,cls){statusEl.textContent=msg||'';statusEl.className='status'+(cls?' '+cls:'')}function setGate(msg,cls){gateStatus.textContent=msg||'';gateStatus.className='status'+(cls?' '+cls:'')}function fillManifest(){document.getElementById('manifest').value=JSON.stringify({name:'KTL Publish '+Date.now().toString(36),url:SITE+'/publish/',hook_attributes:{url:SITE+'/api/setup/github-app-install',active:false},redirect_url:SITE+'/api/setup/github-app',setup_url:SITE+'/api/setup/github-app-install',callback_urls:[SITE+'/api/auth/callback'],request_oauth_on_install:false,description:'Sign in to publish on Ken Turner Law.',public:false,default_permissions:{contents:'write',metadata:'read'}})}function showGate(){app.classList.add('hidden');gate.classList.remove('hidden')}function showApp(login){gate.classList.add('hidden');app.classList.remove('hidden');document.getElementById('who').textContent=login?'Signed in as '+login:'';loadPosts()}function updateCategories(){var p=document.getElementById('practice').value,c=document.getElementById('category'),current=c.value;c.innerHTML='';categories[p].forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x||'None';c.appendChild(o)});if(categories[p].indexOf(current)>=0)c.value=current}document.getElementById('practice').addEventListener('change',updateCategories);updateCategories();function refresh(){return fetch('/api/publish/status',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){if(d.signedIn){showApp(d.login)}else{showGate()}}).catch(showGate)}refresh();document.getElementById('signin').onclick=function(){setGate('Opening GitHub…');fetch('/api/publish/status',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){if(d.oauthConfigured){location.href='/api/auth/login'}else{fillManifest();document.getElementById('setup-form').submit()}}).catch(function(){location.href='/api/auth/login'})};document.getElementById('signout').onclick=async function(){await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});showGate();setGate('Signed out.','ok')};function wrapSelection(mark){var t=document.getElementById('body'),a=t.selectionStart,b=t.selectionEnd,selected=t.value.slice(a,b);t.setRangeText(mark+selected+mark,a,b,'end');t.focus()}document.querySelectorAll('[data-wrap]').forEach(function(b){b.onclick=function(){wrapSelection(b.getAttribute('data-wrap'))}});document.getElementById('add-link').onclick=function(){var t=document.getElementById('body'),a=t.selectionStart,b=t.selectionEnd,text=t.value.slice(a,b)||'link text',url=prompt('Paste the link address:');if(!url)return;t.setRangeText('['+text+']('+url.trim()+')',a,b,'end');t.focus()};function resetForm(){form.reset();document.getElementById('original-slug').value='';document.getElementById('form-heading').textContent='New Article';submit.textContent='Publish';document.getElementById('cancel-edit').classList.add('hidden');updateCategories();setStatus('')}document.getElementById('cancel-edit').onclick=resetForm;function editPost(slug){var p=posts.find(function(x){return x.slug===slug});if(!p)return;document.getElementById('original-slug').value=p.slug;document.getElementById('practice').value=p.practiceArea||(p.category==='Family law'?'family-law':'criminal-defense');updateCategories();document.getElementById('category').value=p.category||'';document.getElementById('county').value=p.county||'';document.getElementById('title').value=p.title||'';document.getElementById('body').value=p.body||'';document.getElementById('form-heading').textContent='Edit Article';submit.textContent='Save Changes';document.getElementById('cancel-edit').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function deletePost(slug,title){if(!confirm('Delete “'+title+'” permanently?'))return;var r=await fetch('/api/publish',{method:'DELETE',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug})});var d=await r.json().catch(function(){return{}});if(!r.ok){setStatus(d.error||'Delete failed.','err');return}setStatus('Deleted. The page will disappear after the site rebuilds.','ok');loadPosts()}function renderPosts(){var q=document.getElementById('search').value.toLowerCase(),box=document.getElementById('articles');var list=posts.filter(function(p){return !q||[p.title,p.category,p.county,p.practiceArea].join(' ').toLowerCase().includes(q)});if(!list.length){box.innerHTML='<p class="hint">No matching articles.</p>';return}box.innerHTML='';list.forEach(function(p){var d=document.createElement('div');d.className='article';var published=p.datePublished?new Date(p.datePublished).toLocaleString():'Unknown';var modified=p.dateModified?new Date(p.dateModified).toLocaleString():published;d.innerHTML='<div class="article-title"></div><div class="meta"></div><div class="article-actions"></div>';d.querySelector('.article-title').textContent=p.title;d.querySelector('.meta').textContent=(p.practiceArea||'criminal-defense').replace(/-/g,' ')+' • '+(p.county?p.county+' County • ':'')+'Published '+published+(modified!==published?' • Updated '+modified:'');var a=d.querySelector('.article-actions');var view=document.createElement('a');view.className='btn secondary';view.href=p.url;view.target='_blank';view.rel='noopener';view.textContent='View';a.appendChild(view);var edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=function(){editPost(p.slug)};a.appendChild(edit);var del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=function(){deletePost(p.slug,p.title)};a.appendChild(del);box.appendChild(d)})}document.getElementById('search').addEventListener('input',renderPosts);async function loadPosts(){var r=await fetch('/api/publish',{credentials:'same-origin'});var d=await r.json().catch(function(){return{}});if(!r.ok){document.getElementById('articles').innerHTML='<p class="err">'+(d.error||'Could not load articles.')+'</p>';return}posts=d.posts||[];renderPosts()}form.onsubmit=async function(e){e.preventDefault();submit.disabled=true;setStatus(document.getElementById('original-slug').value?'Saving changes…':'Publishing…');var payload={originalSlug:document.getElementById('original-slug').value,practiceArea:document.getElementById('practice').value,category:document.getElementById('category').value,county:document.getElementById('county').value,title:document.getElementById('title').value.trim(),body:document.getElementById('body').value.trim()};try{var r=await fetch('/api/publish',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});var d=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(d.error||'Publish failed.');setStatus('Saved: '+d.url,'ok');resetForm();await loadPosts()}catch(err){setStatus(err.message||String(err),'err')}finally{submit.disabled=false}}})();
</script>
</body>
</html>
