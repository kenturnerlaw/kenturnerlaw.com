<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#000000">
<title>Login</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 18px 40px;
  background:#050505 url('/dark-leather.webp');color:#fff;
  font-family:Georgia,"Times New Roman",serif;line-height:1.45
}
h1{color:#e4c36a;font-size:1.4rem;margin:1.5rem 0 1rem;font-weight:400;letter-spacing:.04em}
label{display:block;margin:1rem 0 .35rem;color:#cfcfcf;font-size:.95rem}
input[type=text],textarea,select{
  width:100%;font:inherit;font-size:1.05rem;line-height:1.4;
  padding:14px 12px;border:1px solid #5a5a5a;border-radius:3px;
  background:#111;color:#fff;-webkit-appearance:none;appearance:none
}
textarea{min-height:220px;resize:vertical}
.row{display:flex;gap:10px}
.row>div{flex:1}
.type-row{display:flex;gap:14px;margin:.35rem 0 0}
.type-row label{display:flex;align-items:center;gap:.45rem;margin:0;color:#fff;font-size:1rem}
button,a.btn{
  display:block;width:100%;margin-top:1.25rem;padding:14px;
  border:1px solid #e4c36a;background:#000;color:#e4c36a;
  font:inherit;font-size:1.05rem;cursor:pointer;text-align:center;text-decoration:none
}
button:disabled{opacity:.55;cursor:wait}
button.secondary,a.btn.secondary{margin-top:.7rem;border-color:#555;color:#bbb;font-size:.95rem}
.status{margin-top:1rem;min-height:1.2em;font-size:.92rem;color:#ddd}
.status.ok{color:#8dca9a}
.status.err{color:#e89a9a}
.hint{font-size:.88rem;color:#aaa;margin:.5rem 0 0;line-height:1.35}
.hidden{display:none}
.wrap{max-width:420px;margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
  <section id="gate">
    <h1>Login</h1>
    <p class="hint">Use your existing GitHub account. No separate site username or password.</p>
    <a class="btn" id="signin" href="/api/auth/login">Sign in with GitHub</a>
    <form id="setup-form" class="hidden" action="https://github.com/settings/apps/new" method="post">
      <input type="hidden" name="manifest" id="manifest">
      <button type="submit">Sign in with GitHub</button>
    </form>
    <div id="gate-status" class="status" aria-live="polite"></div>
  </section>

  <section id="app" class="hidden">
    <h1>New post</h1>
    <p class="hint" id="who"></p>
    <form id="publish-form">
      <div class="type-row">
        <label><input type="radio" name="type" value="answer" checked> Question</label>
        <label><input type="radio" name="type" value="update"> Update</label>
      </div>
      <label for="title">Title</label>
      <input id="title" type="text" required maxlength="180">
      <label for="body">Text</label>
      <textarea id="body" required placeholder="Dictate or paste from Notes"></textarea>
      <div class="row">
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="">—</option>
            <option>Police encounters</option>
            <option>Searches</option>
            <option>Arrest and court</option>
            <option>DUI</option>
            <option>Drug charges</option>
            <option>Domestic violence</option>
            <option>Traffic</option>
            <option>Family law</option>
            <option>General</option>
          </select>
        </div>
        <div>
          <label for="county">County</label>
          <select id="county">
            <option value="">—</option>
            <option>Collier</option>
            <option>Lee</option>
            <option>Hendry</option>
            <option>Miami-Dade</option>
          </select>
        </div>
      </div>
      <button type="submit" id="submit">Post</button>
      <button type="button" class="secondary" id="signout">Sign out</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
  </section>
</div>
<script>
(function () {
  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var gateStatus = document.getElementById('gate-status');
  var statusEl = document.getElementById('status');
  var form = document.getElementById('publish-form');
  var submit = document.getElementById('submit');
  var signin = document.getElementById('signin');
  var setupForm = document.getElementById('setup-form');
  var SITE = 'https://www.kenturnerlaw.com';

  function setGate(msg, cls) {
    gateStatus.textContent = msg || '';
    gateStatus.className = 'status' + (cls ? ' ' + cls : '');
  }
  function setStatus(msg, cls) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }
  function showGate(needsSetup) {
    app.classList.add('hidden');
    gate.classList.remove('hidden');
    if (needsSetup) {
      signin.classList.add('hidden');
      setupForm.classList.remove('hidden');
      document.getElementById('manifest').value = JSON.stringify({
        name: 'KTL Publish ' + Date.now().toString(36),
        url: SITE + '/publish/',
        hook_attributes: { url: SITE + '/api/setup/github-app-install', active: false },
        redirect_url: SITE + '/api/setup/github-app',
        setup_url: SITE + '/api/setup/github-app-install',
        callback_urls: [SITE + '/api/auth/callback'],
        request_oauth_on_install: false,
        description: 'Sign in to publish on Ken Turner Law.',
        public: false,
        default_permissions: { contents: 'write', metadata: 'read' }
      });
      setGate('First time: continue on GitHub (create + install for this repo). Then Sign in with GitHub again.', '');
    } else {
      signin.classList.remove('hidden');
      setupForm.classList.add('hidden');
    }
  }
  function showApp(login) {
    gate.classList.add('hidden');
    app.classList.remove('hidden');
    document.getElementById('who').textContent = login ? ('Signed in as ' + login) : '';
  }

  var params = new URLSearchParams(location.search);
  var err = params.get('error');
  if (err) {
    var errMsg = {
      setup_expired: 'Setup timed out. Tap Sign in with GitHub again and stay in this Safari window.',
      setup_save: 'Could not save setup. Tap Sign in with GitHub again.',
      setup_store: 'Could not save sign-in keys. Tap Sign in with GitHub again.',
      setup_install: 'GitHub install did not finish. Tap Sign in with GitHub again.',
      setup_convert: 'GitHub did not finish creating the app. Tap Sign in with GitHub again.',
      forbidden: 'That GitHub account cannot publish to this site.',
      not_configured: 'Sign in is still connecting. Wait a few seconds, then try again.',
      token: 'GitHub sign-in did not finish. Try Sign in with GitHub again.',
      state: 'Sign in expired. Tap Sign in with GitHub again.'
    };
    setGate(errMsg[err] || 'Sign in failed. Try Sign in with GitHub again.', 'err');
  }

  function refresh() {
    return fetch('/api/publish/status', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.signedIn) {
          showApp(d.login);
          return d;
        }
        var needsSetup = (!d.oauthConfigured && params.get('connected') !== '1') || params.get('setup') === '1';
        if (params.get('connected') === '1' && d.oauthConfigured) {
          needsSetup = false;
        }
        showGate(needsSetup);
        if (params.get('connected') === '1') {
          if (d.oauthConfigured) {
            setGate('Connected. Tap Sign in with GitHub.', 'ok');
          } else {
            setGate('Finishing connect… tap Sign in with GitHub in a few seconds.', 'ok');
          }
        }
        return d;
      });
  }

  refresh().catch(function () { showGate(false); });

  // Avoid the old dead loop: login → setup → same page with no GitHub window.
  signin.addEventListener('click', function (ev) {
    ev.preventDefault();
    setGate('Opening GitHub…');
    fetch('/api/publish/status', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.oauthConfigured) {
          showGate(true);
          setGate('Sign in is not connected yet. Use the button below once, finish on GitHub, then come back.', 'err');
          return;
        }
        window.location.href = '/api/auth/login';
      })
      .catch(function () {
        window.location.href = '/api/auth/login';
      });
  });

  document.getElementById('signout').onclick = async function () {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
    showGate(false);
    setGate('Signed out.');
  };

  form.onsubmit = async function (ev) {
    ev.preventDefault();
    var title = document.getElementById('title').value.trim();
    var body = document.getElementById('body').value.trim();
    var type = (form.querySelector('input[name="type"]:checked') || {}).value || 'answer';
    if (!title || !body) { setStatus('Title and text required.', 'err'); return; }
    submit.disabled = true;
    setStatus('Posting…');
    try {
      var res = await fetch('/api/publish', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: title,
          body: body,
          type: type,
          category: document.getElementById('category').value,
          county: document.getElementById('county').value
        })
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.status === 401) { showGate(false); throw new Error('Sign in required.'); }
      if (data.needsSetup) { showGate(true); throw new Error(data.error || 'Sign in setup needed.'); }
      if (!res.ok) throw new Error(data.error || 'Failed');
      setStatus('Posted: ' + (data.url || data.path), 'ok');
      form.reset();
    } catch (e) {
      setStatus(e.message || String(e), 'err');
    } finally {
      submit.disabled = false;
    }
  };
})();
</script>
</body>
</html>
